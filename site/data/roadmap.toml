# The roadmap on the website: "What's new" → "Roadmap". What is planned, grouped by
# when, without dates.
#
# A release candidate's website takes this file from the candidate, so a change here
# goes public with the next candidate or release (docs/development/website.md).
#
# One [[items]] block per feature, in the order the page lists them:
#
#   priority   now | next | later                    the group it is listed under
#   status     preview | in-progress | planned       optional: the chip beside its title
#   de, en     title, and optionally text: Markdown, a sentence or two on what a
#              family gets from it -- in both languages, or the build stops
#
# The roadmap is public: what is planned, not how it was decided.
#
# [[items]]
# priority = 'now'
# status = 'in-progress'
# de.title = 'Titel'
# de.text = 'Ein, zwei Sätze, was die Familie davon hat.'
# en.title = 'Title'
# en.text = 'A sentence or two on what the family gets.'



