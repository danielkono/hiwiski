# The public website. Built with `hugo` in this directory; the
# release workflow sets HUGO_PARAMS_VERSION to the released version and, for a release
# candidate, HUGO_PARAMS_CANDIDATE.

# The site's one address. The earlier hiwiski.danielkononov.de still serves the same
# pages, but every page's canonical link names this one, so search engines list the
# pages here and not twice.
baseURL = 'https://hiwiski.app/'
title = 'Hiwiski'
disableKinds = ['taxonomy', 'term', 'rss']
enableRobotsTXT = true

defaultContentLanguage = 'de'
defaultContentLanguageInSubdir = true

[params]
  # Whether search engines may index the site. A page can still keep itself out with
  # `noindex` in its front matter.
  indexable = true
  # The released version, shown on the apps page. Empty for a local build.
  version = ''
  # The release candidate the site was built for, e.g. 2026.2.0-rc.1: the preview page
  # names its image and links its pre-release. Empty for a release and a local build.
  candidate = ''
  # Where the scenes' web build is served.
  embedBase = '/embed/'
  demo = 'https://demo.hiwiski.app/'
  github = 'https://github.com/danielkono/hiwiski'
  # Where testers send what they noticed: TestFlight and Google Play's test name the
  # same address.
  feedback = 'feedback@danielkononov.de'

  # Where each app comes from, for the apps page and its link on the home page.
  # `store` once the app is in its store, `test` for the public test. Whatever is set is
  # shown; a platform with neither says "soon". Moving from the test to the stores is a
  # change here, not in a template.
  [params.apps.ios]
    store = ''
    # TestFlight's public link. Apple reviews the first build of each version before
    # the link offers it.
    test = 'https://testflight.apple.com/join/MhTFxGNk'
  [params.apps.android]
    store = ''
    # Google Play's opt-in page; the same address serves a closed and an open test.
    test = 'https://play.google.com/apps/testing/de.danielkononov.hiwiski'
    # A closed test admits only the members of this group, which anyone may join. Empty
    # once the test is open to everyone: the step that asks to join then disappears.
    group = 'https://groups.google.com/g/hiwiski-testers'

  # Where the next version can be tried before its release, for the preview page under
  # "What's new". A way whose link is empty says it is not set up yet.
  [params.preview]
    # The demo of the release candidate.
    demo = 'https://preview.hiwiski.app/'
    # TestFlight's public link of the group that gets the candidates.
    ios = 'https://testflight.apple.com/join/hwFBRCs4'
    # The Google Group that Google Play's track for the candidates admits; its members
    # opt in on the same test page as for the released version (`apps.android.test`).
    android = 'https://groups.google.com/g/hiwiski-preview-testers'

[languages.de]
  label = 'Deutsch'
  locale = 'de'
  contentDir = 'content/de'
  weight = 1
  [languages.de.params]
    ogLocale = 'de_DE'
    privacy = '/datenschutz'
    appPrivacy = '/app/datenschutz'

[languages.en]
  label = 'English'
  locale = 'en'
  contentDir = 'content/en'
  weight = 2
  [languages.en.params]
    ogLocale = 'en_US'
    privacy = '/privacy'
    appPrivacy = '/app/privacy'

# The search page is for people on the site, not for search engines.
[[cascade]]
  [cascade.params]
    noindex = true
  [cascade.sitemap]
    disable = true
  [cascade.target]
    path = '/search'

# The changelog and the license are the repository's own files, not copies.
[[module.mounts]]
  source = 'assets'
  target = 'assets'
[[module.mounts]]
  source = '../CHANGELOG.md'
  target = 'assets/CHANGELOG.md'
[[module.mounts]]
  source = '../LICENSE.md'
  target = 'assets/LICENSE.md'

[markup.goldmark.renderer]
  # A how-to's text is Markdown rendered by its shortcode, with the scenes in it
  # already HTML. Every word here is the repository's own.
  unsafe = true
[markup.highlight]
  noClasses = false
  style = 'github'
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
