<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F1F8EC"/>
      <stop offset="1" stop-color="#C6DEB8"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.45" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#D7EFCB" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#7DB874" stop-opacity="0.45"/>
      <stop offset="0.85" stop-color="#3B6939" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#244623" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="b8" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1224" height="1224"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="b14" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1224" height="1224"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="b24" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1224" height="1224"><feGaussianBlur stdDeviation="24"/></filter>
    <path id="L" d="M 380 800 V 250 M 380 500 H 550 A 90 90 0 0 1 640 590 V 800"/>
    <mask id="tubeMask" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1224" height="1224">
      <rect x="-100" y="-100" width="1224" height="1224" fill="#000"/>
      <use href="#L" fill="none" stroke="#fff" stroke-width="116" stroke-linecap="round"/>
    </mask>
    <clipPath id="ballClip"><circle cx="640" cy="292" r="100"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(2 -13)">
    <!-- Schatten -->
    <g opacity="0.26" filter="url(#b24)">
      <use href="#L" transform="translate(16 34)" fill="none" stroke="#2A4F29" stroke-width="100" stroke-linecap="round"/>
      <circle cx="656" cy="326" r="90" fill="#2A4F29"/>
    </g>

    <!-- Glasröhre -->
    <use href="#L" fill="none" stroke="#3B6939" stroke-opacity="0.42" stroke-width="116" stroke-linecap="round"/>
    <g mask="url(#tubeMask)" fill="none" stroke-linecap="round">
      <!-- dunkler Glasrand -->
      <use href="#L" stroke="#1F4A1F" stroke-opacity="0.6" stroke-width="116" filter="url(#b8)"/>
      <!-- durchscheinende Mitte -->
      <use href="#L" stroke="#7DB874" stroke-opacity="0.55" stroke-width="84" filter="url(#b14)"/>
      <use href="#L" stroke="#DDF2D1" stroke-opacity="0.55" stroke-width="40" filter="url(#b14)"/>
      <!-- leichte Schattierung unten/rechts -->
      <use href="#L" transform="translate(10 20)" stroke="#1F3D1E" stroke-opacity="0.18" stroke-width="80" filter="url(#b14)"/>
    </g>

    <!-- Glaskugel -->
    <circle cx="640" cy="292" r="100" fill="url(#ball)"/>
    <g clip-path="url(#ballClip)">
      <circle cx="640" cy="292" r="100" fill="none" stroke="#1A361A" stroke-opacity="0.4" stroke-width="16" filter="url(#b8)"/>
      <circle cx="666" cy="326" r="98" fill="none" stroke="#1F3D1E" stroke-opacity="0.15" stroke-width="40" filter="url(#b14)"/>
    </g>
  </g>
</svg>
