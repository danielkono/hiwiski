components:
  schemas:
    # The error shape is part of the contract, even when no endpoint names it right now.
    # Without this entry the generators would only produce it once the first error case
    # is documented -- and until then the client would have no type for it.
    ApiError:
      $ref: './components/errors.yaml#/ApiError'

    # The field schemas of the synced entities. They sit next to the envelope, not
    # inside it: `ChangeEnvelope.fields` is free-form so that an unknown type does not
    # break an older app. They are binding all the same.
    TodoListFields:
      $ref: './components/todo.yaml#/TodoListFields'
    TodoFields:
      $ref: './components/todo.yaml#/TodoFields'
    TodoOccurrenceFields:
      $ref: './components/todo.yaml#/TodoOccurrenceFields'
    TagFields:
      $ref: './components/tag.yaml#/TagFields'
    PinboardNodeFields:
      $ref: './components/wiki.yaml#/PinboardNodeFields'
    PinboardEdgeFields:
      $ref: './components/wiki.yaml#/PinboardEdgeFields'

  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: |
        Opaque device token, stored as a hash on the server and revocable at any time.
        Not a JWT: a JWT cannot be revoked before it expires, but a lost phone must be
        lockable right away.

security:
  - deviceToken: []
