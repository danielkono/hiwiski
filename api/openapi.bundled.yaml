            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Busy: `media.busy` when an upload found no free turn within half a minute. The
            `Retry-After` header and the `retryAfterSeconds` parameter say when to try again.
          headers:
            Retry-After:
              description: Seconds until the next attempt.
              schema:
                type: integer
      summary: Back up now
      tags:
      - admin
  /api/v1/admin/backups/uploads:
