  /api/v1/members/{id}/sign-out:
    post:
      description: |
        Administrator only. Every device of the member loses access at once (`401`, an
        open event stream gets `revoked`); the member can sign in again. Changes on those
        devices that have not been synced yet stay there, locked, until the member signs
        in again. The administrator's own devices are in their own device
        list instead: for the administrator the answer is `400` with
        `identity.member_is_admin`.
      operationId: signOutMember
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "204":
          description: Signed out
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
