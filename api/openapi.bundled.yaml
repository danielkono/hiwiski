          staySignedIn: true
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          memberId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: Annas iPhone
          platform: IOS
          createdAt: 2000-01-23T04:56:07.000+00:00
          lastSeenAt: 2000-01-23T04:56:07.000+00:00
          lastSyncSeq: 0
          pendingCount: 6
          current: true
          staySignedIn: true
      properties:
        devices:
          items:
            $ref: "#/components/schemas/Device"
          type: array
      required:
      - devices
