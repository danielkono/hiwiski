    MemberList:
      example:
        members:
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          username: anna
          displayName: Anna
          isAdmin: true
          colorToken: BLUE
          groupIds:
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          disabled: true
          createdAt: 2000-01-23T04:56:07.000+00:00
          avatarImageId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          username: anna
          displayName: Anna
          isAdmin: true
          colorToken: BLUE
          groupIds:
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          disabled: true
          createdAt: 2000-01-23T04:56:07.000+00:00
          avatarImageId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        members:
          items:
            $ref: "#/components/schemas/Member"
          type: array
      required:
