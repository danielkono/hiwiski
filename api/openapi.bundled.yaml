openapi: 3.0.3
info:
  description: |
    The HTTP interface of the family app.

    This file is written by hand and is the source of truth: the server interfaces and
    the Dart client are generated from it, not the other way round.

    There are two styles side by side:

    * **Synced entities** go exclusively through `/api/v1/sync/pull` and
      `/api/v1/sync/push`. For tasks, events, wiki pages and everything else that lives
      on the device there is deliberately no CRUD over REST. A second write path would
      have to implement validation, sharing, conflict logic and log writing a second
      time -- and would drift from it.
    * **Classic REST** only for login, invitations, handshake, wiki revisions, history,
      search, imports, images and administration.

    Contract rules every change must follow:

    * Fields only additive and optional. Never rename, never change the meaning, never
      make `required` after the fact.
    * Enums are only extended. The client must survive an unknown value.
    * `oneOf` and discriminators are avoided -- the generators, especially on the Dart
      side, handle them poorly.
    * Deletion only after a deprecation period.
    * Within a year there is no break. A real break is called `/api/v2` and comes at the
      turn of the year.

    `GET /api/v1/events` is the only endpoint **outside** this spec: a long-lived SSE
    stream cannot be expressed in OpenAPI, and the generators turn it into unusable
    signatures on both sides.
  title: Hiwiski API
  version: "2026.1"
servers:
- description: The family's home server
  url: /
security:
- deviceToken: []
tags:
- description: "Version and capability negotiation, reachable without login"
  name: platform
- description: "The initial setup, can be run exactly once"
  name: setup
- description: "Login, session, password"
  name: auth
- description: Your own devices and revoking them
  name: devices
- description: The members of the family
  name: members
- description: "Groups -- recipients of a share, not roles"
  name: groups
- description: Invitations with code and QR
  name: invitations
- description: "Ownership and sharing — three levels, one inheritance rule"
  name: access
- description: Deleted items and restoring them
  name: trash
- description: "Settings, backup, log — administrator only"
  name: admin
- description: |
    Downloading and uploading backup archives. Excluded from the Dart generation for
    the same reason as `images`: a binary body becomes `dart:io File` there.
  name: backupFiles
- description: "Restoring an archive on a fresh server, from the setup wizard"
  name: setupRestore
- description: |
    Triggering a subscription sync, importing a file, and the agenda a home screen
    widget reads. Calendars and events themselves are written exclusively through the
    sync.
  name: calendar
- description: |
    Revisions, references and the recipe import. The pages themselves go through the
    sync.
  name: wiki
- description: |
    The media store: images on pages and recipes. Excluded from the Dart
    generation — a binary body becomes `dart:io File` there.
  name: images
- description: |
    What a list holds, for a home screen widget. Lists and tasks themselves go
    exclusively through the sync.
  name: todo
- description: |
    The product catalog and the shopping list's categories -- the only domain entities
    without an owner and without a share.
  name: catalog
- description: |
    The wall tablet board under its own address -- without login.
  name: dashboard
- description: |
    Search across everything the asker may see -- and the history of an item.
  name: search
- description: |
    Pull and push. Everything that lives on the device goes exclusively through here.
  name: sync
paths:
  /api/v1/handshake:
    get:
      description: |
        Reachable without login. The client calls this on startup and after every
        connection setup.
      operationId: getHandshake
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handshake"
          description: The server's state
      security: []
      summary: Version and capabilities of the server
      tags:
      - platform
  /api/v1/setup:
    post:
      description: |
        Reachable without login, but only **once**: if `setup.completed` is set, the
        server answers with `409`.

        Where the operator switched the **setup code** on (`Handshake.setupCodeRequired`),
        only with the code from the server's log (`setupCode`): a wrong or missing one
        answers `403 setup.code_invalid`, checked before anything else; ten wrong ones per
        client address are free, then one every thirty seconds (`429`). Without it the
        code is ignored.

        Creates the family name, time zone, the administrator account and the first
        groups and logs the device in right away -- otherwise the first user would have
        to log in again immediately after creating everything.
      operationId: runSetup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedIn"
          description: Set up and logged in
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Conflict
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Too many requests: `auth.too_many_attempts` after repeated failed logins. The
            `Retry-After` header and the `retryAfterSeconds` parameter say when to try again.
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema:
                type: integer
      security: []
      summary: Set up the instance
      tags:
      - setup
  /api/v1/setup/code:
    post:
      description: |
        The wizard asks for the code first and checks it here at once -- otherwise a wrong
        one came back only after every step was filled in. Checked exactly like
        `runSetup` and from the same budget: a wrong or missing code is
        `403 setup.code_invalid`, ten wrong ones per client address are free, then one
        every thirty seconds (`429`); each check counts as a try, so it makes guessing no
        easier. Where no code is asked for, every code is right.

        Then, like the wizard: an instance set up already is `409
        setup.already_completed` -- only to whoever holds the code. Changes nothing.
      operationId: checkSetupCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCodeCheck"
        required: true
      responses:
        "204":
          description: "The code is right, and the instance is not set up yet"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Conflict
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Too many requests: `auth.too_many_attempts` after repeated failed logins. The
            `Retry-After` header and the `retryAfterSeconds` parameter say when to try again.
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema:
                type: integer
      security: []
      summary: Check the setup code before the wizard's steps
      tags:
      - setup
  /api/v1/setup/uploads:
    post:
      description: |
        As `uploadBackup`, without a sign-in -- there is no one yet -- but with the setup
        code where one is asked for. Once the instance is set up it is
        `409 setup.already_completed`.
      operationId: uploadSetupBackup
      parameters:
      - description: |
          The setup code from the server's log, as in `SetupRequest.setupCode`.
          Left out where the server asks for none (`Handshake.setupCodeRequired`); missing
          where it does, it is `403 setup.code_invalid`.
        in: header
        name: X-Hiwiski-Setup-Code
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupUpload"
          description: Uploaded
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Conflict
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Too many requests: `auth.too_many_attempts` after repeated failed logins. The
            `Retry-After` header and the `retryAfterSeconds` parameter say when to try again.
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema:
                type: integer
      security: []
      summary: Upload an archive to restore on a fresh server
      tags:
      - backupFiles
  /api/v1/setup/uploads/{id}/inspect:
    post:
      description: |
        As `inspectUploadedBackup`. A wrong password is `400 admin.backup_password_wrong`,
        an archive of a newer server `400 admin.backup_too_new`.
      operationId: inspectSetupBackup
      parameters:
      - description: |
          The setup code from the server's log, as in `SetupRequest.setupCode`.
          Left out where the server asks for none (`Handshake.setupCodeRequired`); missing
          where it does, it is `403 setup.code_invalid`.
        in: header
        name: X-Hiwiski-Setup-Code
        required: false
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupPasswordEntry"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupPreview"
          description: The preview
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Conflict
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Too many requests: `auth.too_many_attempts` after repeated failed logins. The
            `Retry-After` header and the `retryAfterSeconds` parameter say when to try again.
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema:
                type: integer
      security: []
      summary: What restoring the uploaded archive would bring back
      tags:
      - setupRestore
  /api/v1/setup/uploads/{id}/restore:
    post:
      description: |
        Members, groups and the administrator come from the archive, and so does the
        backup key -- wrapped with the password just typed, which opens the backups from
        then on. Nobody is signed in: the wizard goes on to the sign-in screen.
      operationId: restoreSetupBackup
      parameters:
      - description: |
          The setup code from the server's log, as in `SetupRequest.setupCode`.
          Left out where the server asks for none (`Handshake.setupCodeRequired`); missing
          where it does, it is `403 setup.code_invalid`.
        in: header
        name: X-Hiwiski-Setup-Code
        required: false
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupPasswordEntry"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
          description: Restored
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Conflict
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Too many requests: `auth.too_many_attempts` after repeated failed logins. The
            `Retry-After` header and the `retryAfterSeconds` parameter say when to try again.
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema:
                type: integer
      security: []
      summary: Set the instance up from the uploaded archive
      tags:
      - setupRestore
  /api/v1/auth/login:
    post:
      description: |
        Login attempts are **delayed, not locked out** -- a locked-out family has no
        support channel. The delay counts per username *and* client
        address, so an outsider guessing at a known username slows only themselves;
        each address also has a budget of failed sign-ins across usernames, and each
        username a ceiling across addresses. The ceiling does not apply to an
        `installationId` that has signed in to the account before, nor to an address the
        username signed in from recently: a stranger cannot keep the member's own devices
        out.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedIn"
          description: Logged in
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Too many requests: `auth.too_many_attempts` after repeated failed logins. The
            `Retry-After` header and the `retryAfterSeconds` parameter say when to try again.
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema:
                type: integer
      security: []
      summary: Log in
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Logged out
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
      summary: Revoke your own device
      tags:
      - auth
  /api/v1/auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: The current session
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
      summary: "Who am I, what is my state"
      tags:
      - auth
  /api/v1/auth/password:
    post:
      description: |
        The one call with content that a session with `mustChangePassword` may make
        (see `Session.mustChangePassword` for the full list).

        A wrong current password is delayed like a failed sign-in: otherwise a stolen
        token could guess the password itself, which outlives revoking the token.

        All other devices of this member are signed out (they get `401`, an open event
        stream gets `revoked`): a new password is how a member locks out whoever learned
        the old one. The device that made the change stays signed in.
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: Changed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Too many requests: `auth.too_many_attempts` after repeated failed logins. The
            `Retry-After` header and the `retryAfterSeconds` parameter say when to try again.
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema:
                type: integer
      summary: Change your own password
      tags:
      - auth
  /api/v1/devices:
    get:
      description: |
        Only your own. The administrator does not see other people's devices -- they may
        manage the server, not other people's content.
      operationId: listDevices
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
          description: This member's devices
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
      summary: Your own devices
      tags:
      - devices
  /api/v1/devices/{id}:
    delete:
      description: |
        Takes effect immediately. Changes on the device that have not been synced yet
        are lost -- the UI says so right there.
      operationId: revokeDevice
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "204":
          description: Locked out
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      summary: Lock out a device
      tags:
      - devices
  /api/v1/members:
    get:
      description: |
        Everyone sees the list. Whoever lives in a family knows who belongs to it anyway
        -- and without it nothing could be assigned or shared with anyone.

        The client stores it locally: avatars, assignments and share lists must still be
        nameable offline.
      operationId: listMembers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
          description: All members
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
      summary: The members of the family
      tags:
      - members
    post:
      description: |
        Administrator only. The way without an invitation -- e.g. for the member who owns
        the wall tablet dashboard.
      operationId: createMember
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Conflict
      summary: Create a member
      tags:
      - members
  /api/v1/members/{id}:
    patch:
      description: |
        The profile: display name, colour, appearance, picture. Every member may change
        their own; the administrator anyone's.

        Group membership is not changed here -- it belongs to the group (`updateGroup`).
      operationId: updateMember
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
          description: Changed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      summary: Change a member
      tags:
      - members
  /api/v1/members/{id}/password-reset:
    post:
      description: |
        Administrator only. There is no self-service path because there is no email.
        The temporary password is returned **once** and cannot be retrieved again
        afterwards; on the next login the user has to choose their own.

        Every device of the member is signed out: otherwise the old tokens -- a device
        someone else signed into with a leaked password included -- worked again as soon
        as the member chose a new password.

        For the administrator themselves there is no way through the app -- use
        `docker compose exec app hiwiski reset-admin-password` instead.
      operationId: resetMemberPassword
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordReset"
          description: Set
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      summary: Set a temporary password
      tags:
      - members
  /api/v1/members/{id}/disable:
    post:
      description: |
        Administrator only.
        The member can no longer sign in, and every device of theirs is signed out at
        once -- for a stolen phone, or a member who left on bad terms. Their things stay
        as they are, and so do their shares; `enableMember` undoes it. The administrator
        cannot be disabled: `400` with `identity.member_is_admin`.
      operationId: disableMember
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
          description: Disabled
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      summary: Disable a member
      tags:
      - members
  /api/v1/members/{id}/enable:
    post:
      description: |
        Administrator only. The member signs in again with their password; the devices
        signed out when they were disabled stay signed out.
      operationId: enableMember
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
