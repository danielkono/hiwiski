  /api/v1/invitations:
    get:
      description: |
        Administrator only, like creating one: a code is a family account in the
        invitation's groups for whoever redeems it first.

        They appear on the family screen as "Invited - 24 h left" with a placeholder
        avatar. Without code and deep link: the server keeps only a hash
        of the code, which goes out once, in the answer to `createInvitation`.
      operationId: listInvitations
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
          description: Open invitations
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
      summary: Open invitations
      tags:
      - invitations
    post:
      description: Administrator only.
      operationId: createInvitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
          description: Created
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
      summary: Create an invitation
      tags:
      - invitations
  /api/v1/invitations/{code}:
    get:
      description: |
        Without login. Without this card nobody knows what they are joining.

        An expired or used code answers with `404` -- the same answer as for a made-up
        one, so that valid codes cannot be guessed. Counted per client address with the
        redemption: ten codes that match nothing are free, then one every thirty seconds
        (`429` with `Retry-After`).
      operationId: previewInvitation
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
          description: What you are joining
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Too many requests: `auth.too_many_attempts` after repeated failed logins. The
            `Retry-After` header and the `retryAfterSeconds` parameter say when to try again.
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema:
                type: integer
      security: []
      summary: Preview an invitation
      tags:
      - invitations
  /api/v1/invitations/{code}/redeem:
    post:
      operationId: redeemInvitation
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemInvitationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedIn"
          description: Joined and logged in
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Conflict
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Too many requests: `auth.too_many_attempts` after repeated failed logins. The
            `Retry-After` header and the `retryAfterSeconds` parameter say when to try again.
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema:
                type: integer
      security: []
      summary: Join a family
      tags:
      - invitations
  /api/v1/invitations/{id}/revoke:
    post:
      description: |
        Administrator only. Its code stops opening anything at once, and it leaves the
        list of open invitations -- for one handed to the wrong person, or not needed
        any more.

        A `POST` on its own path and not a `DELETE` on `/api/v1/invitations/{id}`: that
        path is the preview's, which takes a code.

        `404` with `identity.invitation_not_found` when there is no open invitation with
        this id: redeemed, withdrawn already, or never there.
      operationId: revokeInvitation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "204":
          description: Withdrawn
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      summary: Withdraw an open invitation
      tags:
      - invitations
  /api/v1/items/{itemType}/{itemId}/shares:
    get:
      operationId: getShares
      parameters:
      - in: path
        name: itemType
        required: true
        schema:
          type: string
      - in: path
        name: itemId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareSheet"
          description: "Owner, assignees, inherited and own shares"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      summary: The share sheet of an item
      tags:
      - access
    put:
      description: |
        Owner only. *Write* allows creating, changing and deleting within the container
        — **not** changing the share. Whoever sees the item but does not
        own it gets `403`; whoever does not see it gets `404`, the same as for an id that
        does not exist.

        A board (`BOARD`), its tiles (`WIDGET`), a calendar feed (`CALENDAR_FEED`) and a
        member's list order (`LIST_ORDER`) belong to one member and cannot be shared:
        `400` with `access.not_shareable`. A board's or feed's token is a session of its
        owner; sync delivers it to the owner's devices only.
      operationId: setShares
      parameters:
      - in: path
        name: itemType
        required: true
        schema:
          type: string
      - in: path
        name: itemId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteSharesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareSheet"
          description: The new sheet
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      summary: Set the own shares of an item
      tags:
      - access
  /api/v1/trash:
    get:
      description: |
        Sorted by time. Everyone sees what they deleted themselves and what was shared
        with them; the administrator sees nothing more — they may manage the server, not
        other people's content.
      operationId: listTrash
      parameters:
      - description: Filter by type.
        in: query
        name: itemType
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashList"
          description: The trash
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
      summary: Deleted items from all modules
      tags:
      - trash
  /api/v1/trash/{itemType}/{itemId}/restore:
    post:
      description: |
        Brings the item back **including its share**. If its container is gone by now,
        the server answers with `400` and the code `trash.container_gone` — the UI then
        asks for a target and sends it as `targetContainerId`.

        Only the owner, or whoever may delete the item, restores it -- that is, whoever may
        write both the item and the container it lies in; a list, a calendar or a root page
        comes back only by its owner's hand. Anyone else gets `404`, as for
        an item that is not in the trash. A `targetContainerId` moves the item, and moving
        is the owner's: anyone else gets `403` (`access.denied`). A target that does not exist, or
        that the caller may not write, is `404` as well (`sync.container_not_found`).
      operationId: restoreFromTrash
      parameters:
      - in: path
        name: itemType
        required: true
        schema:
          type: string
      - in: path
        name: itemId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
        required: false
      responses:
        "204":
          description: Restored
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      summary: Restore
      tags:
      - trash
  /api/v1/admin/settings:
    get:
