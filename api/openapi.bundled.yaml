          description: |
            A picture uploaded with this member as its carrier (`ownerType` `MEMBER`).
          format: uuid
          nullable: true
          type: string
        removeAvatar:
          description: Takes the picture away; the initial shows again.
          nullable: true
          type: boolean
      type: object
    PasswordReset:
      description: |
        The temporary password. It is shown **once** and cannot be retrieved again
        afterwards; on the next login the user has to choose their own.
      example:
        temporaryPassword: temporaryPassword
      properties:
        temporaryPassword:
          type: string
      required:
      - temporaryPassword
      type: object
    GroupList:
      example:
        groups:
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: Parents
          iconToken: group
          position: 0
          memberIds:
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: Parents
          iconToken: group
          position: 0
          memberIds:
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        groups:
          items:
            $ref: "#/components/schemas/Group"
          type: array
