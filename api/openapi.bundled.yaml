    CreateMemberRequest:
      description: "Administrator only. The way without an invitation, e.g. for the\
        \ wall tablet."
      example:
        displayName: displayName
        username: username
        password: password
        colorToken: BLUE
        groupIds:
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        displayName:
          type: string
        username:
          type: string
        password:
          format: password
          minLength: 8
          type: string
        colorToken:
          $ref: "#/components/schemas/ColorToken"
        groupIds:
          items:
            format: uuid
            type: string
          type: array
      required:
      - displayName
      - password
      - username
      type: object
    Member:
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        username: anna
        displayName: Anna
        isAdmin: true
        colorToken: BLUE
        groupIds:
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        disabled: true
        createdAt: 2000-01-23T04:56:07.000+00:00
        avatarImageId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        id:
          format: uuid
          type: string
        username:
          description: "Unique, lowercase."
          example: anna
          type: string
        displayName:
          example: Anna
          type: string
        isAdmin:
          description: |
            Exactly one member has this. It is assigned during setup, cannot be taken
            away and is the only way into the server.

            In domain terms the administrator has **no special rights**: they see other
            people's tasks no more than anyone else does.
          type: boolean
        colorToken:
          $ref: "#/components/schemas/ColorToken"
        groupIds:
          items:
            format: uuid
            type: string
          type: array
        disabled:
          description: |
            Disabled by the administrator (`disableMember`): no sign-in, no session, every
            device signed out. The member and their things stay; `enableMember` lets them
            sign in again.
          type: boolean
        createdAt:
          format: date-time
          type: string
        avatarImageId:
          description: |
            The member's picture in the media store (`GET /images/{id}/preview`); `null`
            shows the initial.
          format: uuid
          nullable: true
          type: string
      required:
      - colorToken
      - displayName
      - id
      - isAdmin
      - username
      type: object
    UpdateMemberRequest:
      description: |
        What a member may change about themselves. The username stays, because it appears
        in mentions and log lines.
      example:
        displayName: displayName
        colorToken: BLUE
        appearance: LIGHT
        avatarImageId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
