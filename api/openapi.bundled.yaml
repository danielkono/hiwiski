        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      summary: What restoring an archive would bring back
      tags:
      - admin
  /api/v1/admin/backups/{id}/restore:
    post:
      description: |
        **Replaces everything.** The current state is backed up first, so that a restore
        by mistake can be undone. The instance identifier is regenerated in the process;
        every device uses it to tell that its state is no longer valid, and syncs from
        scratch.

        An archive restores on the server version it came from and on every newer one:
        it is restored into a staging schema at its own version and migrated on.
        A wrong password changes nothing
        (`400 admin.backup_password_wrong`), and neither does another family's archive
        (`400 admin.backup_other_family`).

        A backup that has never been restored is not a backup — that is why this path is
        in the same phase as backing up.
      operationId: restoreBackup
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupPasswordEntry"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
          description: Restored
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Conflict
      summary: Restore a backup
      tags:
      - admin
  /api/v1/admin/backup-password:
    put:
      description: |
        Wraps the same backup key anew -- in the database and in the header of every
        archive in the backup directory made with it. Copies already downloaded keep the
