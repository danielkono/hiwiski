    HistoryEntry:
      example:
        seq: 0
        at: 2000-01-23T04:56:07.000+00:00
        actorId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        op: upsert
        fields:
        - fields
        - fields
        status: ""
        archived: true
        column: column
        entryId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        entryTitle: entryTitle
      properties:
        seq:
          format: int64
          type: integer
        at:
          format: date-time
          type: string
        actorId:
          format: uuid
          nullable: true
          type: string
        op:
          enum:
          - upsert
          - delete
          type: string
        fields:
          description: Which fields this change touched.
          items:
            type: string
          type: array
        status:
          allOf:
          - $ref: "#/components/schemas/TodoStatus"
          description: |
            The task's status after this change — only when the change touched `status`.
            The field name alone does not tell "checked off" from "opened again".
        archived:
          description: |
            Whether the item is archived after this change — only when the change touched
            `archivedAt`. Archiving and restoring touch the same two fields.
          type: boolean
        column:
          description: |
            The column a card stands in after this change, by the name its board gives it
            now -- only when the change touched `columnId`, and absent once the column is
            gone. The field name alone does not say where the card went.
          type: string
        entryId:
          description: |
            In a list's history: the task this change was made to — absent for a change to
            the list itself. Ticking off or deleting an entry shows on the list without
            opening the entry.
          format: uuid
          type: string
        entryTitle:
          description: The task's title as it is now — also for a deleted one.
          type: string
      required:
      - at
      - op
      - seq
      type: object
    PullRequest:
      example:
        lastSeq: 0
        deviceId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        pendingCount: 6
        limit: 1
        snapshot: false
        snapshotCursor: snapshotCursor
      properties:
        lastSeq:
          format: int64
          type: integer
        deviceId:
          format: uuid
          type: string
        pendingCount:
          description: |
            How many changes are still waiting on the device. Reported by the device with
            every pull -- only this way can the device list show "3 changes waiting -
            offline for 12 days".
          type: integer
        limit:
          default: 500
          description: At most this many entries per response.
          type: integer
        snapshot:
          default: false
          description: |
            The **state** instead of the log: every live, visible item once, with all
            fields, containers before their content. For a device's first sync and for the
            rebuild after `resyncRequired`. The log is cleaned up after the retention
            period; whoever replayed it from 0 would afterwards only get what someone has
            touched since -- and of that only the changed fields.
            `lastSeq` is not read in this case.
          type: boolean
        snapshotCursor:
          description: |
            Where the snapshot continues -- the `snapshotCursor` of the previous response,
            unchanged. If it is missing, a new snapshot starts.
          type: string
      required:
      - deviceId
      - lastSeq
      type: object
    PullResponse:
      example:
        changes:
        - seq: 0
          entityType: TODO
          entityId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          containerType: TODO_LIST
          containerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          op: upsert
          fields:
            key: ""
          version: 6
          entityKey: TD-14
          ownerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - seq: 0
          entityType: TODO
          entityId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          containerType: TODO_LIST
          containerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          op: upsert
          fields:
            key: ""
          version: 6
          entityKey: TD-14
          ownerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        latestSeq: 0
        hasMore: true
        instanceId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        resyncRequired: true
        snapshotCursor: snapshotCursor
      properties:
        changes:
          items:
            $ref: "#/components/schemas/ChangeEnvelope"
          type: array
        latestSeq:
          description: The position the client remembers once it has processed everything.
          format: int64
          type: integer
        hasMore:
          description: There are more entries; pull again right away.
          type: boolean
        instanceId:
          description: |
            Identifier of the instance. Regenerated on restore -- if it differs from the
            remembered one, your own sequence numbers no longer apply.
          format: uuid
          type: string
        resyncRequired:
          description: |
            `lastSeq` lies before the oldest log entry, or the instance identifier has
            changed. The client **first** tries to push its outbox; whatever is rejected
            ends up in a visible list to copy from instead of silently disappearing. Then
            it discards its local data and reloads.
          type: boolean
        snapshotCursor:
          description: |
            Only for a snapshot and only while `hasMore` holds: the cursor for the next
            page. During a snapshot `latestSeq` is the same on every page -- the position
            at its start. After the last page the log continues from there; whatever
            happened during the snapshot thus arrives a second time, which does no harm.
          type: string
      required:
      - changes
      - hasMore
      - instanceId
      - latestSeq
      - resyncRequired
      type: object
    PushRequest:
      example:
        deviceId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        pendingCount: 0
        mutations:
        - mutationId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          entityType: entityType
          entityId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          containerType: containerType
          containerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          op: upsert
          baseVersion: 6
          fields:
            key: ""
        - mutationId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          entityType: entityType
          entityId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          containerType: containerType
          containerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          op: upsert
          baseVersion: 6
          fields:
            key: ""
        - mutationId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          entityType: entityType
          entityId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          containerType: containerType
          containerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          op: upsert
          baseVersion: 6
          fields:
            key: ""
        - mutationId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          entityType: entityType
          entityId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          containerType: containerType
          containerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          op: upsert
          baseVersion: 6
          fields:
            key: ""
        - mutationId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          entityType: entityType
          entityId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          containerType: containerType
          containerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          op: upsert
          baseVersion: 6
          fields:
            key: ""
      properties:
        deviceId:
          format: uuid
          type: string
        pendingCount:
          type: integer
        mutations:
          description: |
            At most 200 per push (the app sends 50); more is a `400` for the whole call.
            Each mutation holds the instance's writer lock, so an unbounded push would stall
            every other device's sync. Values have limits too: a text
            field at most 200,000 characters, a list of ids at most 500 entries, a JSON field
            at most 256 KiB, a merged map (an event's exceptions) at most 5,000 keys. A value
            beyond them rejects that one mutation with `sync.value_too_large`. The request
            body as a whole may be at most 32 MiB (`413`, `request.too_large`).
          items:
            $ref: "#/components/schemas/Mutation"
          maxItems: 200
          type: array
      required:
      - deviceId
      - mutations
      type: object
    PushResponse:
      example:
        results:
        - mutationId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          status: applied
          entityId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          version: 0
          entityKey: entityKey
          conflictFields:
