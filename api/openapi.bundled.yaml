          type: array
        latestSeq:
          format: int64
          type: integer
      required:
      - latestSeq
      - results
      type: object
    EventTicket:
      description: |
        Short-lived ticket for the SSE stream.

        `EventSource` in the browser cannot send a header, so in an earlier version this endpoint was
        the only one without login -- it gave away *that* something had changed. Instead,
        the app requests a ticket beforehand and appends it as a query parameter.
      example:
        ticket: ticket
        expiresAt: 2000-01-23T04:56:07.000+00:00
      properties:
        ticket:
          type: string
        expiresAt:
          format: date-time
          type: string
      required:
      - expiresAt
      - ticket
      type: object
    SetupAdmin:
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        displayName: displayName
        username: username
        password: password
      properties:
        id:
          description: |
            The administrator's id, when the app brings one -- see
            `RedeemInvitationRequest.memberId`.
          format: uuid
          type: string
        displayName:
          type: string
        username:
          type: string
        password:
          format: password
          minLength: 8
          type: string
      required:
      - displayName
      - password
      - username
      type: object
    DeviceRegistration:
      description: Whoever logs in registers their device at the same time.
      example:
        deviceName: Annas iPhone
        platform: IOS
        staySignedIn: true
        installationId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        deviceName:
          example: Annas iPhone
          type: string
        platform:
          $ref: "#/components/schemas/DevicePlatform"
        staySignedIn:
          default: true
          description: |
            `false` means: the token is not stored permanently and expires with the
            session. On the wall tablet that is never wanted, on a shared computer
            always. The server ends such a session after 12 hours without a request.
          type: boolean
        installationId:
          description: |
            Names this installation of the app, the same across sign-ins. A sign-in from
            an installation retires the devices registered from it before: the app holds
            one token at a time, so an earlier one is dead even when its sign-out never
            reached the server — and would otherwise linger in the device list.
          format: uuid
          type: string
      required:
      - deviceName
      - platform
      type: object
    AppearanceMode:
      description: |
        The choice belongs to the member, not the device, and is therefore kept here. It is
        also stored locally so that the very first frame after startup is already right.
      enum:
      - LIGHT
      - DARK
      - SYSTEM
      type: string
    Device:
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        memberId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        name: Annas iPhone
        platform: IOS
        createdAt: 2000-01-23T04:56:07.000+00:00
        lastSeenAt: 2000-01-23T04:56:07.000+00:00
        lastSyncSeq: 0
        pendingCount: 6
        current: true
        staySignedIn: true
      properties:
        id:
          format: uuid
          type: string
        memberId:
          format: uuid
          type: string
        name:
          example: Annas iPhone
          type: string
        platform:
          $ref: "#/components/schemas/DevicePlatform"
        createdAt:
          format: date-time
          type: string
        lastSeenAt:
          format: date-time
          type: string
        lastSyncSeq:
          description: |
            Reported by the device with every pull. Only this way can the device list show
            "3 changes waiting - offline for 12 days", and that is exactly what the design
            asks for.
          format: int64
          type: integer
        pendingCount:
          description: How many changes on the device are still waiting to be synced.
          type: integer
        current:
          description: The device this request comes from. It has no "sign out".
          type: boolean
        staySignedIn:
          description: |
            `false` for a session that ends 12 hours after the device was last seen.
            Every device ends 180 days after it was last seen.
          type: boolean
      required:
      - createdAt
      - current
      - id
      - memberId
      - name
      - platform
      type: object
    ColorToken:
      description: |
        What is stored is a **token, not a hex value**: a stored hex
        value would be unreadable in one of the two themes. The mapping from token to color
        lives in the client, once for light and once for dark.
      enum:
      - BLUE
      - RUST
      - VIOLET
      - GREEN
      - PINK
      - OCHRE
      - TEAL
      - SLATE
      example: BLUE
      type: string
    InvitationValidity:
      enum:
      - HOUR_1
      - HOURS_24
      - DAYS_7
      type: string
    AccessLevel:
      description: |
        * `READ` -- see, search, comment, link
        * `CHECK` -- additionally toggle a task's status. Nothing else: no title, no due
          date, no deleting. This level is not optional -- the design requires it on the
          wall tablet and on the children's shopping list.
        * `WRITE` -- additionally create, change and delete within the container. Not:
          change the share or delete the container.
      enum:
      - READ
      - CHECK
      - WRITE
      type: string
    ShareEntry:
      example:
        subjectType: MEMBER
        subjectId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        level: null
        source: OWNER
      properties:
        subjectType:
          $ref: "#/components/schemas/ShareSubjectType"
        subjectId:
          format: uuid
          type: string
        level:
          $ref: "#/components/schemas/AccessLevel"
        source:
          $ref: "#/components/schemas/ShareSource"
      required:
      - level
      - source
      - subjectId
      - subjectType
      type: object
    WriteShare:
      example:
        subjectType: MEMBER
        subjectId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        level: READ
      properties:
        subjectType:
          $ref: "#/components/schemas/ShareSubjectType"
        subjectId:
          format: uuid
          type: string
        level:
          $ref: "#/components/schemas/AccessLevel"
      required:
      - level
      - subjectId
      - subjectType
      type: object
    TrashEntry:
      description: |
        Something deleted. The trash was forgotten in the design and is mandatory all
        the same: without it every disappearance is final, and for a family app that is the
        wrong promise.
      example:
        itemType: itemType
        itemId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        title: title
        entityKey: entityKey
        deletedAt: 2000-01-23T04:56:07.000+00:00
        deletedBy: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        remainingDays: 0
        restorable: true
      properties:
        itemType:
          type: string
        itemId:
          format: uuid
          type: string
        title:
          type: string
        entityKey:
          description: "The citable number, if this type has one."
          type: string
        deletedAt:
          format: date-time
          type: string
        deletedBy:
          format: uuid
          type: string
        remainingDays:
          description: How much longer it is kept before the retention period removes
            it for good.
          type: integer
        restorable:
          description: |
            `false` if the container is gone by now. Restoring then needs a
            `targetContainerId`.
          type: boolean
      required:
      - deletedAt
      - itemId
      - itemType
      - remainingDays
      - restorable
      - title
      type: object
    BackupStatus:
      description: How backing up goes -- the status line on top of the backup settings.
      example:
        lastBackupAt: 2000-01-23T04:56:07.000+00:00
        nextDueAt: 2000-01-23T04:56:07.000+00:00
        failure:
          at: 2000-01-23T04:56:07.000+00:00
          reason: DIRECTORY_NOT_WRITABLE
          trigger: SCHEDULED
        directory: directory
        passwordSet: true
      properties:
        lastBackupAt:
          description: The newest archive's time; absent while there is none.
          format: date-time
          type: string
        nextDueAt:
          description: When the scheduled backup runs next.
          format: date-time
          type: string
        failure:
          $ref: "#/components/schemas/BackupFailure"
        directory:
          description: |
            The backup directory as the server sees it (`/data/backup` in the container).
            On the host it is `HIWISKI_BACKUP_DIR`.
          type: string
        passwordSet:
          description: |
            `false` only on an instance set up before backups were encrypted: nothing is
            backed up until a backup password is set.
          type: boolean
      required:
      - directory
      - passwordSet
      type: object
    PreviewEvent:
      example:
        title: title
        allDay: true
        startsAt: 2000-01-23T04:56:07.000+00:00
        startDate: 2000-01-23
        recurring: true
      properties:
        title:
          type: string
        allDay:
          type: boolean
        startsAt:
          format: date-time
          nullable: true
          type: string
        startDate:
          format: date
          nullable: true
          type: string
        recurring:
          type: boolean
      required:
      - allDay
      - title
      type: object
    ImportCalendar:
      description: |
        Import into a **new** calendar under the id in the path, created by the import. Without
        it the calendar must exist.
      example:
        name: name
        colorToken: BLUE
        locked: true
      properties:
        name:
          type: string
        colorToken:
          $ref: "#/components/schemas/ColorToken"
        locked:
          description: |
            Locked like a subscription: the calendar's kind is `IMPORTED`, its events are read
            only and it takes no new ones — only a further import updates it.
          type: boolean
      required:
      - colorToken
      - locked
      - name
      type: object
    AgendaOccurrence:
      example:
        eventId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        calendarId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        title: title
        location: location
        colorToken: colorToken
        start: 2026-11-12T08:00
        end: end
        allDay: true
        moved: true
      properties:
        eventId:
          format: uuid
          type: string
        calendarId:
          format: uuid
          type: string
        title:
          type: string
        location:
          nullable: true
          type: string
        colorToken:
          description: |
            The calendar's color token (`BLUE`, `RUST`, …), as a string. An unknown one
            falls back to `SLATE`, as everywhere.
          type: string
        start:
          description: |
            Local time without zone (`yyyy-MM-ddTHH:mm`), in the window's zone. A series
            hangs on the wall clock of its own zone and is shown at that time, as in the
            app. For an all-day event the day at `00:00`.
          example: 2026-11-12T08:00
          type: string
        end:
          description: |
            Local time without zone. For an all-day event the last day at `00:00`,
            **inclusive**: 29.09.–10.10. ends on 10.10., as people read it.
          type: string
        allDay:
          type: boolean
        moved:
          description: An occurrence of a series that was moved away from its rule.
          type: boolean
      required:
      - allDay
      - calendarId
      - end
      - eventId
      - start
      - title
      type: object
    ListSummaryColumn:
      description: "The column asked for, when the board has it."
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        name: name
        colorToken: colorToken
        done: true
        count: 5
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        colorToken:
          nullable: true
          type: string
        done:
          type: boolean
        count:
          description: How many cards stand in the column.
          type: integer
      required:
      - done
      - id
      - name
      type: object
    ListSummaryItem:
      example:
        todoId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        title: title
        done: true
        amount: 5.637376656633329
        unit: unit
        dueDate: 2000-01-23
        dueTime: dueTime
      properties:
        todoId:
          format: uuid
          type: string
        title:
          type: string
        done:
          type: boolean
        amount:
          description: Only on the shopping list.
          nullable: true
          type: number
        unit:
          nullable: true
          type: string
        dueDate:
          format: date
          nullable: true
          type: string
        dueTime:
          description: "Local time without zone, `HH:mm`."
          nullable: true
          type: string
      required:
      - done
      - title
      - todoId
      type: object
    ChangeEnvelope:
      description: |
        The envelope is strictly typed; `fields` is free-form in the spec, the schemas per
        type sit next to it as components. A handwritten dispatcher in the client decodes
        based on `entityType`.
      example:
        seq: 0
        entityType: TODO
        entityId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        containerType: TODO_LIST
        containerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        op: upsert
        fields:
          key: ""
        version: 6
        entityKey: TD-14
        ownerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        seq:
          description: |
            Monotonically increasing per family. More robust than timestamps across device
            clocks.
          format: int64
          type: integer
        entityType:
          description: |
            Deliberately **not an enum**: an older app must be able to skip an unknown
            type and, after an update, pull everything once from scratch. That is the
            price for property 2, and it is low.
          example: TODO
          type: string
        entityId:
          format: uuid
          type: string
        containerType:
          description: The container the item inherits its share from.
          example: TODO_LIST
          type: string
        containerId:
          format: uuid
          type: string
        op:
          $ref: "#/components/schemas/SyncOp"
        fields:
          additionalProperties: true
          description: |
            Only the changed fields. **Not an optimization but a requirement**: otherwise
            an older app blanks out fields it does not know and wipes out the work of a
            newer device.
            A snapshot (`snapshot`) contains all fields the server knows.
          type: object
        version:
          description: |
            The entity's version **after** this change. The client remembers it and sends
            it back as `baseVersion`; whoever increments it locally makes every later
            change run into a conflict.
          format: int64
          type: integer
        entityKey:
          description: |
            The readable key, if this type gets one. It is assigned exactly once, on the
            first sync to the server.
          example: TD-14
          type: string
        ownerId:
          description: |
            Who owns the item — whoever created it. Set on every upsert. Without it the
            client cannot tell its own comments from someone else's, or show the owner
            in the info bar.
          format: uuid
          type: string
      required:
      - entityId
      - entityType
      - op
      - seq
      - version
      type: object
    TodoStatus:
      enum:
      - OPEN
      - DONE
      type: string
    Mutation:
      example:
        mutationId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        entityType: entityType
        entityId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        containerType: containerType
        containerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        op: upsert
        baseVersion: 6
        fields:
          key: ""
      properties:
        mutationId:
          description: |
            Client-generated idempotency key. Otherwise retries after a dropped connection
            would create things twice.
          format: uuid
          type: string
        entityType:
          type: string
        entityId:
          description: "UUIDv7, generated by the client -- with auto-increment nothing\
            \ could be created offline."
          format: uuid
          type: string
        containerType:
          type: string
        containerId:
          format: uuid
          type: string
        op:
          enum:
          - upsert
          - delete
          type: string
        baseVersion:
          description: |
            The version this mutation builds on. Comes from the last pull and is **never
            incremented locally**. If it is missing, this is a creation.
          format: int64
          type: integer
        fields:
          additionalProperties: true
          description: Only the changed fields. Never whole objects.
          type: object
      required:
      - entityId
      - entityType
      - mutationId
      - op
      type: object
    MutationResult:
      example:
        mutationId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        status: applied
        entityId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        version: 0
        entityKey: entityKey
        conflictFields:
        - conflictFields
        - conflictFields
        serverFields:
          key: ""
        baseFields:
          key: ""
        code: todo.list_not_found
      properties:
        mutationId:
          format: uuid
          type: string
        status:
          $ref: "#/components/schemas/MutationStatus"
        entityId:
          format: uuid
          type: string
        version:
          format: int64
          type: integer
        entityKey:
          description: The readable key assigned on the first sync.
          type: string
        conflictFields:
          description: |
            The fields that were discarded because someone else changed them in the
            meantime. **A conflict is always shown** -- in an earlier version it silently discarded the
            change, and that is the worst kind of bug: one nobody notices.
          items:
            type: string
          type: array
        serverFields:
          additionalProperties: true
          description: The current server state of the discarded fields.
          type: object
        baseFields:
          additionalProperties: true
          description: |
            For `conflict`: the discarded fields as they were at the mutation's
            `baseVersion` — what both sides started from. The conflict view shows it
            next to the server's and the device's version. A field is missing when the log
            no longer reaches back that far.
          type: object
        code:
          description: "For `rejected`, the error code the client translates."
          example: todo.list_not_found
          type: string
      required:
      - mutationId
      - status
      type: object
    TodoListKind:
      description: |
        Cannot be changed after creation: a shopping list has amounts and aisles, a task
        list has due dates. The one exception: `STANDARD` may become
        `KANBAN`; every other change is rejected with `todo.kind_locked`.
      enum:
      - STANDARD
      - SHOPPING
      - KANBAN
      type: string
    TagIds:
      description: |
        The tags on an item, as IDs. Stored on the item and synced with its share. An ID
        whose tag the reader cannot see or that has been deleted is skipped.
      items:
        format: uuid
        type: string
      type: array
    KanbanColumn:
      description: |
        A column of a Kanban board. A card names it by `id`, so renaming or
        recoloring a column moves no card.
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        colorToken:
          $ref: "#/components/schemas/ColorToken"
        done:
          description: |
            The done column -- exactly one per board. A card in it is `DONE`, a card in any
            other `OPEN`.
          type: boolean
      required:
      - done
      - id
      - name
      type: object
    DevicePlatform:
      enum:
      - IOS
      - ANDROID
      - WEB
      - MACOS
      - WINDOWS
      - LINUX
      - UNKNOWN
      type: string
    ShareSubjectType:
      description: |
        Groups are stored **as a reference** and not resolved into members: whoever joins
        the group later is included as a result.
      enum:
      - MEMBER
      - GROUP
      type: string
    ShareSource:
      description: |
        Where the row comes from. The UI shows inherited shares greyed out with the note
        "inherited from the list" and automatically assigned ones with "automatic - assigned".
      enum:
      - OWNER
      - DIRECT
      - INHERITED
      - ASSIGNED
      type: string
    BackupFailure:
      description: |
        The last backup failed. Shown until the next one succeeds; the last good archive
        stays where it is.
      example:
        at: 2000-01-23T04:56:07.000+00:00
        reason: DIRECTORY_NOT_WRITABLE
        trigger: SCHEDULED
      properties:
        at:
          format: date-time
          type: string
        reason:
          enum:
          - DIRECTORY_NOT_WRITABLE
          - DISK_FULL
          - NO_BACKUP_PASSWORD
          - OTHER
          type: string
        trigger:
          enum:
          - SCHEDULED
          - ON_DEMAND
          - BEFORE_UPDATE
          - BEFORE_RESTORE
          type: string
      required:
      - at
      - reason
      type: object
    SyncOp:
      description: |
        Four operations. The last two are **synthetic**: the server writes them when a
        share changes, so that the change takes effect retroactively.

        If someone gets access today to a calendar that was filled last month, those
        changes lie *before* their position -- they would never receive them. So
        `access_granted` triggers a full catch-up of the container, `access_revoked` a
        local deletion.
      enum:
      - upsert
      - delete
      - access_granted
      - access_revoked
      type: string
    MutationStatus:
      description: |
        | Result | Meaning | Consequence in the client |
        | --- | --- | --- |
        | `applied` | accepted | outbox entry gone, remember new `version` |
        | `conflict` | field conflict, server value attached | banner above the content |
        | `rejected` | permanently rejected | blocks the chain, becomes visible |
        | `duplicate` | already processed | counts as success |

        A mutation id already processed gets the answer it got the first time: only an
        applied one is `duplicate`. A rejected one is `rejected` again with its `code`,
        a conflict is `conflict` again with the current `serverFields` (and no
        `baseFields`).
      enum:
      - applied
      - conflict
      - rejected
      - duplicate
      type: string
    uploadImage_request:
      properties:
        ownerType:
          description: |
            `WIKI_PAGE` — pages and recipes —, `TODO_LIST` and `TODO` (images in
            a list's or a task's description), `EVENT` (images in an event's note) or `MEMBER`, one's
            own picture (`ownerItemId` is then one's own member id). A member's
            picture is visible to the whole family.
          type: string
        ownerItemId:
          format: uuid
          type: string
        id:
          description: |
            The image's id, when the app brings one: an image added without a
            server keeps the id its carrier already points to. The
            same id from the same member for the same carrier again is the same
            upload and answers with the stored image; anything else under a taken
            id is `409 media.id_taken`. So is a new id that an item the uploader
            can see but not edit already names (another page's text, another
            member's picture): who may only read an item does not decide what
            its images show. The `409` for a taken id is the same whether or
            not the uploader can see the image that has it; an item the
            uploader cannot see that names a new id is not looked at, and the
            id answers as a fresh one. Two uploads of one new id at the same
            time are answered as if one came after the other.
          format: uuid
          type: string
        file:
          format: binary
          type: string
      required:
      - file
      - ownerItemId
      - ownerType
      type: object
  securitySchemes:
    deviceToken:
      description: |
        Opaque device token, stored as a hash on the server and revocable at any time.
        Not a JWT: a JWT cannot be revoked before it expires, but a lost phone must be
        lockable right away.
      scheme: bearer
      type: http
