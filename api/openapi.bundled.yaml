    post:
      description: |
        A one-off import, not a subscription: the events become ordinary events of the
        calendar, editable like any other — unless the import creates a **locked**
        calendar. The file comes along as content, or as an address fetched once. Events
        are matched by UID and RECURRENCE-ID, so importing the same file twice updates
        instead of doubling; nothing is deleted. With `newCalendar` the calendar is created
        under the id in the path; otherwise it needs *write* on the calendar, and a
        subscribed calendar takes no import.
      operationId: importIcsFile
      parameters:
      - in: path
        name: calendarId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
