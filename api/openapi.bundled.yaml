          application/json:
            schema:
              $ref: "#/components/schemas/CreateAisleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Aisle"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Conflict
      summary: Add a category of the family's own
      tags:
      - catalog
  /api/v1/catalog/aisles/order:
    put:
      description: |
        The IDs in their new order. Categories missing from the list keep their relative
        order after the named ones -- one added on another device meanwhile is not lost.
      operationId: reorderAisles
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AisleOrderRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AisleList"
          description: All categories in the new order
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
      summary: Put the categories in a new order
      tags:
      - catalog
  /api/v1/catalog/aisles/{id}:
    delete:
      description: |
        Its products lose their category and go under "Other". Built-in categories are
        never deleted (`catalog.aisle_builtin`): a product may point at them, and an older
        app knows them by key.
      operationId: deleteAisle
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "204":
          description: Deleted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      summary: Delete a category of the family's own
      tags:
      - catalog
    patch:
      description: |
        Only own categories have a name to change (`catalog.aisle_builtin`); built-in
        ones can only be hidden.
      operationId: updateAisle
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAisleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Aisle"
          description: Changed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Conflict
      summary: Rename a category or hide it
      tags:
      - catalog
  /api/v1/wiki/recipes/import:
    post:
      description: |
        The server fetches and parses; nothing is saved until after the **review screen**.
        `recipeIngredient` is free text and never parses completely --
        lines parsed with low confidence are marked and can be corrected.

        The outgoing request checks the **resolved IP** against private ranges, loopback,
        link-local and metadata addresses -- before **and after** every redirect.
        Otherwise the import becomes a tool for reaching the router.
      operationId: importRecipe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRecipeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedRecipe"
          description: "The parsed recipe, not yet saved"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
      summary: Fetch a recipe from an address and parse it
      tags:
      - wiki
  /api/v1/boards/{token}:
    get:
      description: |
        **Without login, does not expire, revocable**.

        A wall tablet as a full account would bring along a lot of questions nobody
        wants to answer -- a token without expiry in the keychain, an app that never
        logs out, a way out of full screen without a keyboard. The address solves all
        three.

        What is delivered is **only** what the board's owner may see: the session of
        this address is restricted to them and cannot do anything they cannot.
      operationId: getPublicBoard
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardView"
          description: The board with its tiles
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      security: []
      summary: The dashboard under its own address
      tags:
      - dashboard
  /api/v1/boards/{token}/ticket:
    post:
      description: |
        The stream needs a ticket because an SSE connection cannot be opened with a
        header. The ticket is short-lived and runs in the board owner's
        name; the stream carries only change positions, never content. A stream opened
        before the address was regenerated keeps running until it times out (30
        minutes) -- what it signals cannot be read without a valid address.
      operationId: createDashboardTicket
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardTicket"
          description: The ticket
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      security: []
      summary: A ticket for this board's event stream
      tags:
      - dashboard
  /api/v1/boards/{token}/content:
    get:
      description: |
        The items the tiles name -- their calendars and events, their lists and tasks,
        their pages -- for a wall tablet without a sign-in. Without them,
        every data tile on the kiosk was empty, or showed whatever member happened to be
        signed in on that browser.

        Only what the board's owner may see, as a pull would deliver it to them: the same
        envelopes, so the device stores them the way it stores synced items.
      operationId: getPublicBoardContent
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardContent"
          description: "The items, containers before their content"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      security: []
      summary: What this board's tiles show
      tags:
      - dashboard
  /api/v1/search:
    get:
      description: |
        The search uses prefix (`:*`) **and** word part: "kin" must match while typing,
        and "kinder" must find "Kinderarzt". No stemmer splits German compounds; word
        part matches rank 0, behind everything else.

        **The share check sits in the same query as the matches.** Two steps would be a
        time window, and a title alone already gives away too much.
      operationId: search
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
      - description: Restrict to these entity types.
        in: query
        name: types
        required: false
        schema:
          items:
            type: string
          type: array
      - description: |
          Also search the archive. Off by default: whoever searches
          wants what is current. An entered number jumps to its item either way.
        in: query
        name: includeArchived
        required: false
        schema:
          default: false
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
          description: The matches
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
      summary: Search across everything the asker may see
      tags:
      - search
  /api/v1/history/{itemType}/{itemId}:
    get:
      description: |
        From the change log. **The log retention period also limits how far back the
        history reaches — and the UI says so**.

        A list's history also holds the changes to the tasks in it, each naming its task
        (`entryId`, `entryTitle`).

        Over REST and not through the sync: the history only lives as long as the log
        anyway, and mirroring it to every device would be the most expensive way of
        almost never looking at it.
      operationId: getHistory
      parameters:
      - in: path
        name: itemType
        required: true
        schema:
          type: string
      - in: path
        name: itemId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
          description: "The changes, newest first"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      summary: The history of an item
      tags:
      - search
  /api/v1/sync/pull:
    post:
      description: |
        Filtered by share, **in the same query** as the matches. Two steps would be a
        time window, and a title alone already gives away too much.
      operationId: pull
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullResponse"
          description: The delta
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
      summary: The delta since your own position
      tags:
      - sync
  /api/v1/sync/push:
    post:
      description: |
        Every mutation carries its `mutationId` as idempotency key and its
        `baseVersion`. The check is **field by field**: whoever checks something off
        while someone else moves the due date loses nothing.
      operationId: push
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResponse"
          description: One result per mutation
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
      summary: Send local mutations
      tags:
      - sync
  /api/v1/events/ticket:
    post:
      description: |
        Valid for 60 seconds, redeemable once. `GET /api/v1/events` is the **only
        endpoint outside this spec**: a long-lived stream cannot be expressed in OpenAPI,
        and the generators turn it into unusable signatures on both sides.
      operationId: createEventTicket
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTicket"
          description: The ticket
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
      summary: Ticket for the real-time stream
      tags:
      - sync
components:
  parameters:
    SetupCodeHeader:
      description: |
        The setup code from the server's log, as in `SetupRequest.setupCode`.
        Left out where the server asks for none (`Handshake.setupCodeRequired`); missing
        where it does, it is `403 setup.code_invalid`.
      in: header
      name: X-Hiwiski-Setup-Code
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: Invalid in domain terms
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: |
        Not shared -- or `auth.password_change_required`: a session whose password
        has to be changed first may call almost nothing (`Session.mustChangePassword`).
    Conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: Conflict
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: |
        Too many requests: `auth.too_many_attempts` after repeated failed logins. The
        `Retry-After` header and the `retryAfterSeconds` parameter say when to try again.
      headers:
        Retry-After:
          description: Seconds until the next attempt is accepted.
          schema:
            type: integer
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: |
        Does not exist **or** is not visible. The same answer for both -- a `403` would
        give away that it exists.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: Not logged in
    ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: |
        Busy: `media.busy` when an upload found no free turn within half a minute. The
        `Retry-After` header and the `retryAfterSeconds` parameter say when to try again.
      headers:
        Retry-After:
          description: Seconds until the next attempt.
          schema:
            type: integer
    PayloadTooLarge:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: "Too large -- `request.too_large`, past the upload limit of 25\
        \ MB."
  schemas:
    ApiError:
      example:
        code: todo.list_not_found
        params:
          key: params
        correlationId: 8f3c1a92
      properties:
        code:
          description: "Dot-separated key, e.g. `todo.list_not_found`."
          example: todo.list_not_found
          type: string
        params:
          additionalProperties:
            type: string
          description: Values to insert into the translated string.
          type: object
        correlationId:
          description: |
            The request's correlation ID. It is also in the server log -- a user who says
            "error 8f3c" can be traced with it.
          example: 8f3c1a92
          type: string
      required:
      - code
      type: object
    TodoListFields:
      description: Entity type `TODO_LIST`. Container for `TODO`.
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/TodoListKind"
        colorToken:
          $ref: "#/components/schemas/ColorToken"
        position:
          type: integer
        assignees:
          description: |
            Members **and** groups. Assignees see the list automatically and may edit it.
          items:
            format: uuid
            type: string
          type: array
        tags:
          description: |
            The tags on an item, as IDs. Stored on the item and synced with its share. An ID
            whose tag the reader cannot see or that has been deleted is skipped.
          items:
            format: uuid
            type: string
          type: array
        columns:
          description: |
            Only on `KANBAN`: the columns in their order, replaced as a whole. 2 to 8, distinct
            ids, exactly one `done` -- otherwise `todo.kanban_columns_invalid`
            (Kanban).
          items:
            $ref: "#/components/schemas/KanbanColumn"
          nullable: true
          type: array
        archivedAt:
          description: |
            Set while the list is archived: kept, read-only, out of the
            overview. Its tasks count as archived with it. `null` restores it.
          format: date-time
          nullable: true
          type: string
        archivedBy:
          format: uuid
          nullable: true
          type: string
      type: object
    TodoFields:
      description: Entity type `TODO`. Inherits its share from the list.
      properties:
        listId:
          format: uuid
          type: string
        title:
          type: string
        description:
          description: Markdown. References like `#TD-14` become chips when rendered.
          type: string
        status:
          $ref: "#/components/schemas/TodoStatus"
        dueDate:
          format: date
          type: string
        dueTime:
          description: "Local time without zone, `HH:mm`."
          example: 17:30
          type: string
        rrule:
          description: |
            The recurrence rule on the task itself; the occurrences are produced when
            displayed.
            Not on a Kanban board (`todo.kanban_no_repeat`).
          example: FREQ=WEEKLY;BYDAY=MO
          type: string
        assignees:
          description: |
            Members **and** groups. An assignment shares automatically -- otherwise someone
            assigns and the assignee sees nothing.
          items:
            format: uuid
            type: string
          type: array
        position:
          type: integer
        amount:
          description: Only on the shopping list.
          type: number
        unit:
          type: string
        productId:
          format: uuid
          type: string
        columnId:
          description: |
            On a Kanban board: the column the card stands in. A `DONE` card stands in the
            done column whatever this says; an unknown column means the first one
            (Kanban).
          format: uuid
          nullable: true
          type: string
        tags:
          description: |
            The tags on an item, as IDs. Stored on the item and synced with its share. An ID
            whose tag the reader cannot see or that has been deleted is skipped.
          items:
            format: uuid
            type: string
          type: array
      type: object
    TodoOccurrenceFields:
      description: |
        Entity type `TODO_OCCURRENCE`. A checked-off occurrence of a series.

        The server **adds the delivered occurrences instead of replacing the list**.
        Otherwise the second device loses its check mark when both check off different
        occurrences offline. Each occurrence is therefore an entity of its own
        with its own identity -- not an element in a field of the task.
      properties:
        todoId:
          format: uuid
          type: string
        occurrenceDate:
          format: date
          type: string
        doneAt:
          format: date-time
          type: string
        doneBy:
          format: uuid
          type: string
        skipped:
          type: boolean
      type: object
    TagFields:
      description: |
        Entity type `TAG`. An item of its own with owner and share -- there is no
        family-wide "manage tags".
      properties:
        name:
          type: string
        colorToken:
          description: "One of `RED`, `BLUE`, `AMBER`, `VIOLET`, `GREEN`, `PINK`."
          example: BLUE
          type: string
      type: object
    MindmapNodeFields:
      description: |
        Entity type `MINDMAP_NODE`. An element on the canvas of a page of the kind
        `MINDMAP`; its container is the page (`containerType` `WIKI_PAGE`), whose share it
        inherits.

        An item of its own rather than a property of the page, so that two people changing
        different elements never collide: each field of each element has its own conflict
        check.
      properties:
        kind:
          description: |
            `PLAIN` (text without formatting), `NOTE` (Markdown), `IMAGE`, `LINK`, `MEMBER`
            (a member of the family, shown by their picture), `DRAWING` (a stroke drawn by
            hand). The list may grow; an app shows a kind it does not know as a placeholder.
          example: NOTE
          type: string
        x:
          description: "The left edge on the canvas, in logical pixels at a zoom of\
            \ 1."
          type: integer
        "y":
          description: The top edge on the canvas.
          type: integer
        width:
          minimum: 1
          type: integer
        height:
          minimum: 1
          type: integer
        layer:
          description: |
            The stacking order, higher above lower; on a tie the later created element is
            above. A fraction, so that moving one step writes one element only.
          type: number
        text:
          description: |
            The text of a `PLAIN` element, the Markdown of a `NOTE`; the picture of an
            `IMAGE` element as a Markdown image (`![](hiwiski-image:<id>)`), uploaded for
            the page.
          type: string
        target:
          description: |
            The item a `LINK` element points to, as `hiwiski://<type>/<uuid>`; the member a
            `MEMBER` element shows, as `hiwiski://member/<uuid>`. Only a `LINK` element's
            target counts as a link of the page.
          example: hiwiski://todo/0190c1d4-7a1b-7c3d-9e8f-123456789abc
          type: string
        linkView:
          description: |
            What a `LINK` element shows of its target: `TITLE` (its symbol and title) or
            `CONTENT` (the target as its preview shows it). The list may grow; an unknown
            one is shown as `TITLE`. Empty: `TITLE`.
          type: string
        color:
          description: |
            An accent token (`BLUE`, `RUST`, `VIOLET`, `GREEN`, `PINK`, `OCHRE`, `TEAL`,
            `SLATE`; the list may grow) or a colour of the family's own as `#RRGGBB`, which
            the app adapts to the light and the dark theme — `#RRGGBBAA` where the canvas
            shows through it, `00` see-through to `FF` covering. Empty: the theme's own.
          example: "#3B6939"
          type: string
        shape:
          description: |
            `RECTANGLE`, `ROUNDED`, `ELLIPSE`, `PILL`, `DIAMOND`. The list may grow; an
            unknown shape is drawn rounded. On a `DRAWING` element: the shape its stroke was
            drawn as — `RECTANGLE`, `ELLIPSE`, `TRIANGLE`, `DIAMOND`, `LINE`, `ARROW` —
            which the app lets be resized; empty: drawn freehand.
          type: string
        textSize:
          description: |
            `S`, `M`, `L` or `XL` — or a size of its own in logical pixels, 4 to 400 (`18`).
            A name an app does not know is shown as `M`.
          type: string
        textColor:
          description: |
            The colour of the element's text, given as `color` is. Empty: the theme's own,
            or the one that reads best on the element's colour.
          example: SLATE
          type: string
        points:
          description: |
            A `DRAWING` element's stroke, drawn by hand: its points in order, each as two
            whole numbers from 0 to 10000 across the element's width and height, as
            `x,y x,y …` — so it scales with the element. At most 100,000 characters. Each
            stroke is an element of its own, drawn in the element's `color`.
          example: "0,5000 2500,1200 5000,4000 10000,9000"
          type: string
        strokeWidth:
          description: "How thick a `DRAWING` element's stroke is drawn, on the canvas."
          maximum: 1000
          minimum: 1
          type: integer
        rotation:
          description: |
            How far the element is turned clockwise about its centre, in whole degrees.
            Empty: not turned. Connections still meet its unturned outline.
          maximum: 359
          minimum: 0
          type: integer
        textAlign:
          description: |
            Where a note's text stands inside it: `TOP_LEFT`, `TOP_CENTER`, `TOP_RIGHT`,
            `MIDDLE_LEFT`, `CENTER`, `MIDDLE_RIGHT`, `BOTTOM_LEFT`, `BOTTOM_CENTER` or
            `BOTTOM_RIGHT`. Empty: top left. Other names in capitals are taken and shown
            top left by an app that does not know them.
          type: string
      type: object
    MindmapEdgeFields:
      description: |
        Entity type `MINDMAP_EDGE`. A connection between two elements of the same mind map,
        drawn from centre to centre; its container is the page.

        Both ends have to be living elements of the page, on every write: a connection whose
        element is gone is refused with `wiki.mindmap_element_gone`. The ends never change.
        A connection goes with either of its elements.
      properties:
        fromId:
          format: uuid
          type: string
        toId:
          format: uuid
          type: string
        text:
          description: "A label, drawn at the middle of the line."
          type: string
        color:
          description: |
            Like an element's `color`. Empty: the theme's line colour.
          type: string
        strokeWidth:
          description: |
            How thick the line is drawn, on the canvas. Empty: the app's own.
          maximum: 1000
          minimum: 1
          type: integer
        line:
          description: |
            `SOLID`, `DASHED` or `DOTTED`. Empty: solid. Other names in capitals are taken
            and drawn as a solid line by an app that does not know them.
          type: string
        arrows:
          description: |-
            Arrow heads: `END` at the element the connection goes to (`toId`), `START` at
            the one it comes from, `BOTH` or `NONE`. Empty: none. Other names in capitals
            are taken and drawn without heads by an app that does not know them.
          type: string
      type: object
    Handshake:
      example:
        apiVersion: v1
        serverVersion: 2026.1.0
        minClientVersion: 2026.1.0
        familyName: Familie Berger
        setupCompleted: true
        setupCodeRequired: true
        restoring: true
        cleartext: true
        instanceId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        legalNoticeUrl: https://hiwiski.example.org/impressum
        privacyUrl: https://hiwiski.example.org/datenschutz
      properties:
        apiVersion:
          description: "The contract's major version, e.g. `v1`."
          example: v1
          type: string
        serverVersion:
          description: The server's calendar version.
          example: 2026.1.0
          type: string
        minClientVersion:
          description: |
            Oldest client version this server still serves. The client checks this on
            startup and says so with a way to update, instead of failing at some random
            spot.
          example: 2026.1.0
          type: string
        familyName:
          description: |
            Missing as long as the instance is not set up -- before that there is no name,
            and an empty placeholder would be a claim.
          example: Familie Berger
          type: string
        setupCompleted:
          description: "If `false`, the app goes straight into the setup wizard."
          type: boolean
        setupCodeRequired:
          description: |
            Whether the setup wizard asks for the setup code from the server's log
            (`SetupRequest.setupCode`). Off unless the operator switched it on, for a server
            reachable from the internet. Absent from a server older than this field, which
            always asked for it.
          type: boolean
        restoring:
          description: |
            A backup is being restored right now. Until it is done every write is
            `503 instance.restoring`; the app shows that it waits and asks again.
            Absent or
            `false` otherwise.
          type: boolean
        cleartext:
          description: |
            The connection runs without TLS. The app says plainly what applies right now,
            instead of showing a lock that is not one.
          type: boolean
        instanceId:
          description: |
            Identifier of this instance. It is regenerated on restore; devices use it to
            tell that their sequence numbers no longer apply, and sync from scratch.
            Without this identifier devices would silently keep working on a state that
            no longer exists.
          format: uuid
          type: string
        legalNoticeUrl:
          description: |
            Where the operator's legal notice (Impressum) is -- for an instance open to the
            public, such as a review instance. Missing for a family's own server: a private
            instance needs none, and the app then shows no "Legal" section.
          example: https://hiwiski.example.org/impressum
          format: uri
          type: string
        privacyUrl:
          description: |
            Where the operator's privacy policy for this instance is. Missing like
            `legalNoticeUrl`.
          example: https://hiwiski.example.org/datenschutz
          format: uri
          type: string
      required:
      - apiVersion
      - cleartext
      - minClientVersion
      - serverVersion
      - setupCompleted
      type: object
    SetupRequest:
      description: |
        Exactly once, for the first one. After that `setup.completed` is set and the
        wizard is never reachable again.
      example:
        setupCode: K7M4-2QXP
        familyName: Familie Berger
        timezone: Europe/Berlin
        admin:
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          displayName: displayName
          username: username
          password: password
        groups:
        - groups
        - groups
        device:
          deviceName: Annas iPhone
          platform: IOS
          staySignedIn: true
          installationId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        language: de
        backupPassword: backupPassword
      properties:
        setupCode:
          description: |
            The one-time code the server prints to its log at every start while it is not
            set up (`Setup code: K7M4-2QXP`), or the one `HIWISKI_SETUP_CODE` names. Without
            it whoever reached a fresh server first becomes its administrator -- harmless on
            a home network, not on a server reachable from the internet. Asked for only where
            the operator switched it on (`HIWISKI_SETUP_CODE_REQUIRED`, or a fixed
            `HIWISKI_SETUP_CODE`); `Handshake.setupCodeRequired` says which. Where it is
            asked for, a missing one is `403 setup.code_invalid` rather than a validation
            error, so it is optional in the contract; elsewhere it is ignored. Case, dashes
            and spaces do not matter.
          example: K7M4-2QXP
          type: string
        familyName:
          example: Familie Berger
          type: string
        timezone:
          description: "IANA zone, prefilled from the device."
          example: Europe/Berlin
          type: string
        admin:
          $ref: "#/components/schemas/SetupAdmin"
        groups:
          description: |
            Suggested are **Everyone** and **Parents** (the setup wizard uses the language of its UI), renamable, more
            possible. Every new member goes into the first group.
          items:
            type: string
          type: array
        device:
          $ref: "#/components/schemas/DeviceRegistration"
        language:
          description: |
            The language of the wizard's UI, e.g. `de`. The product catalog is seeded in it
            -- German or English, anything else English.
          example: de
          type: string
        backupPassword:
          description: |
            Every backup is locked with it. The server keeps only a public
            key to encrypt with and the private key wrapped with this password -- without
            it no backup can be restored, and nobody can reset it. Not the administrator's
            password: `400 setup.backup_password_same`. Optional in the contract only, like
            `setupCode`, so the code is checked first; the server always requires it
            (`400 setup.backup_password_required`).
          format: password
          minLength: 8
          type: string
      required:
      - admin
      - device
      - familyName
      - timezone
      type: object
    SignedIn:
      description: The token and the state the app continues working with.
      example:
        token: token
        session:
          member:
            id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
            username: anna
            displayName: Anna
            isAdmin: true
            colorToken: BLUE
            groupIds:
            - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
            - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
            disabled: true
            createdAt: 2000-01-23T04:56:07.000+00:00
            avatarImageId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          deviceId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          mustChangePassword: true
          appearance: LIGHT
      properties:
        token:
          description: |
            Opaque random value, stored as a hash on the server. Not a JWT: a JWT cannot be
            revoked before it expires, but a lost phone must be lockable right away.
          type: string
        session:
          $ref: "#/components/schemas/Session"
      required:
      - session
      - token
      type: object
    SetupCodeCheck:
      description: "The setup code alone, checked before the wizard's steps."
      example:
        setupCode: K7M4-2QXP
      properties:
        setupCode:
          description: As in `SetupRequest.setupCode`.
          example: K7M4-2QXP
          type: string
      required:
      - setupCode
      type: object
    BackupUpload:
      description: |
        An uploaded archive, waiting for its password. Deleted after the restore, or an hour
        after the upload if nothing followed.
      example:
        id: id
        bytes: 0
      properties:
        id:
          type: string
        bytes:
          format: int64
          type: integer
      required:
      - bytes
      - id
      type: object
    BackupPasswordEntry:
      example:
        password: password
      properties:
        password:
          description: The backup password the archive was made with.
          format: password
          type: string
      required:
      - password
      type: object
    BackupPreview:
      description: |
        What a restore would bring back, read from the decrypted manifest -- so a wrong
        password shows up before anything is replaced.
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        serverVersion: serverVersion
        schemaVersion: schemaVersion
        bytes: 0
        members: 6
        familyName: familyName
      properties:
        createdAt:
          format: date-time
          type: string
        serverVersion:
          type: string
        schemaVersion:
          type: string
        bytes:
          format: int64
          type: integer
        members:
          description: How many members the archive holds.
          type: integer
        familyName:
          type: string
      required:
      - bytes
      - createdAt
      - members
      - schemaVersion
      - serverVersion
      type: object
    RestoreResult:
      description: |
        **A restore replaces everything.** Afterwards all devices have to sync from
        scratch -- the sequence numbers no longer match what the devices have seen. The
        server detects this through an instance identifier newly generated on restore and
        answers every device with `resyncRequired`. Without this identifier devices would
        silently keep working on a state that no longer exists -- the worst data loss
        imaginable in this app.
      example:
        instanceId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        rows: 0
      properties:
        instanceId:
          description: The **new** identifier. Every device uses it to tell that its
            state is no longer valid.
          format: uuid
          type: string
        rows:
          type: integer
      required:
      - instanceId
      - rows
      type: object
    LoginRequest:
      example:
        username: username
        password: password
        device:
          deviceName: Annas iPhone
          platform: IOS
          staySignedIn: true
          installationId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        username:
          type: string
        password:
          format: password
          type: string
        device:
          $ref: "#/components/schemas/DeviceRegistration"
      required:
      - device
      - password
      - username
      type: object
    Session:
      example:
        member:
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          username: anna
          displayName: Anna
          isAdmin: true
          colorToken: BLUE
          groupIds:
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          disabled: true
          createdAt: 2000-01-23T04:56:07.000+00:00
          avatarImageId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        deviceId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        mustChangePassword: true
        appearance: LIGHT
      properties:
        member:
          $ref: "#/components/schemas/Member"
        deviceId:
          format: uuid
          type: string
        mustChangePassword:
          description: |
            While this is set, the session may change the password
            (`POST /api/v1/auth/password`) and otherwise only call what carries no
            content: `GET /api/v1/auth/session`, `POST /api/v1/auth/logout`, and the
            public handshake and login. Everything else answers `403` with
            `auth.password_change_required`. A state in which the user can use the app
            and swipe the prompt away would not be a prompt.
          type: boolean
        appearance:
          $ref: "#/components/schemas/AppearanceMode"
      required:
      - deviceId
      - member
      - mustChangePassword
      type: object
    ChangePasswordRequest:
      example:
        currentPassword: currentPassword
        newPassword: newPassword
      properties:
        currentPassword:
          format: password
          type: string
        newPassword:
          format: password
          minLength: 8
          type: string
      required:
      - currentPassword
      - newPassword
      type: object
    DeviceList:
      example:
        devices:
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          memberId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: Annas iPhone
          platform: IOS
          createdAt: 2000-01-23T04:56:07.000+00:00
          lastSeenAt: 2000-01-23T04:56:07.000+00:00
          lastSyncSeq: 0
