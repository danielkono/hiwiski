    WriteGroupRequest:
      example:
        name: name
        iconToken: iconToken
        memberIds:
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
