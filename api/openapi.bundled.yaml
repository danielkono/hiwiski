  /api/v1/calendar/agenda:
    get:
      description: |
        What a home screen widget shows when it asks the server itself -- while the app
        is closed, the widget's own refresh is the only one that runs. Events travel
        through the sync; this is the one read of them over REST, and it only reads.

        **Expanded here as the app expands them**: series, cancelled and moved
        occurrences, multi-day events. Both sides check against
        `golden/occurrences.json`. A device that showed something else in its widget than
        in its calendar would be worse than one without a widget.

        The window runs from the moment of the call to the end of the last day asked for,
        in the caller's zone. An occurrence that began before and is still running is in
        it. An event or a calendar the caller cannot see is left out as if it did not
        exist.

        Errors: `400 calendar.time_zone_invalid` for a zone that is not an IANA ID.
      operationId: getAgenda
      parameters:
      - description: |
          The calendars to read. Left out or empty: every calendar the caller can see,
          as on the start board.
        in: query
        name: calendarIds
        required: false
        schema:
          items:
            format: uuid
            type: string
          type: array
      - description: "How many days, today included."
        in: query
        name: days
        required: false
        schema:
          default: 7
          maximum: 31
          minimum: 1
          type: integer
      - description: |
          The device's zone, as an IANA ID. It decides where "today" ends and how a
          timed event's instant reads. Left out: the family's zone.
        in: query
        name: timeZone
        required: false
        schema:
          type: string
      - description: "At most this many occurrences, the earliest first."
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agenda"
          description: "The occurrences in the window, in the app's order"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid in domain terms
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
      summary: The coming occurrences of the chosen calendars
      tags:
      - calendar
  /api/v1/todo/lists/{listId}/summary:
    get:
      description: |
