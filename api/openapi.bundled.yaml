    Group:
      description: |
        A freely named set of members. Serves **only for sharing**, not for permissions --
        it carries no role.

        Groups are stored as a reference and not resolved into members: whoever joins the
        group later is included as a result.
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        name: Parents
        iconToken: group
        position: 0
        memberIds:
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        id:
          format: uuid
          type: string
        name:
          example: Parents
          type: string
        iconToken:
          description: "The name of a Material Symbol, e.g. `group`."
          example: group
          type: string
        position:
          type: integer
        memberIds:
          items:
            format: uuid
            type: string
          type: array
      required:
      - id
      - memberIds
      - name
      - position
      type: object
    InvitationList:
      example:
        invitations:
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          code: K7M42QX
          displayName: displayName
          groupIds:
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          expiresAt: 2000-01-23T04:56:07.000+00:00
          redeemedAt: 2000-01-23T04:56:07.000+00:00
          deepLink: hiwiski://invite?host=http%3A%2F%2Fhiwiski.local&code=K7M42QX
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          code: K7M42QX
          displayName: displayName
          groupIds:
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          expiresAt: 2000-01-23T04:56:07.000+00:00
          redeemedAt: 2000-01-23T04:56:07.000+00:00
          deepLink: hiwiski://invite?host=http%3A%2F%2Fhiwiski.local&code=K7M42QX
      properties:
        invitations:
          items:
            $ref: "#/components/schemas/Invitation"
          type: array
      required:
      - invitations
      type: object
    CreateInvitationRequest:
      example:
        displayName: displayName
        groupIds:
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        validity: HOUR_1
      properties:
        displayName:
          description: "Prefill for the name, which the invitee then confirms."
          type: string
        groupIds:
          items:
            format: uuid
            type: string
          type: array
        validity:
          $ref: "#/components/schemas/InvitationValidity"
      required:
      - validity
      type: object
    Invitation:
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        code: K7M42QX
        displayName: displayName
        groupIds:
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        expiresAt: 2000-01-23T04:56:07.000+00:00
        redeemedAt: 2000-01-23T04:56:07.000+00:00
        deepLink: hiwiski://invite?host=http%3A%2F%2Fhiwiski.local&code=K7M42QX
      properties:
        id:
          format: uuid
          type: string
        code:
          description: |
            Seven characters from an alphabet without easily confused letters. It gets
            read aloud and copied by hand, hence monospace in the UI.

            **Only in the answer to `createInvitation`.** The server keeps only a hash of
            it, like a device token, so the list of open invitations goes out without code
            and deep link.
          example: K7M42QX
          type: string
        displayName:
          type: string
        groupIds:
          items:
            format: uuid
            type: string
          type: array
        expiresAt:
          format: date-time
          type: string
        redeemedAt:
          format: date-time
          type: string
        deepLink:
          description: |
            `hiwiski://invite?host=...&code=...` -- the content of the QR code. `host` is the
            address the server was reached under, **with its scheme** and percent-encoded
            (`host=https%3A%2F%2Fnas.example`): without the scheme a joining device assumed
            `http://` and sent the new password in plain text to a TLS server. The URL
            scheme must be registered in all platform projects; that is exactly what was
            missing in an earlier version. Only in the answer to `createInvitation`,
            like the code.
          example: hiwiski://invite?host=http%3A%2F%2Fhiwiski.local&code=K7M42QX
          type: string
      required:
      - expiresAt
      - id
      type: object
    InvitationPreview:
      description: |
        Retrievable without login. **Without this card nobody knows what they are joining**.
      example:
        familyName: familyName
        invitedBy: invitedBy
        displayName: displayName
        groupNames:
        - groupNames
        - groupNames
        expiresAt: 2000-01-23T04:56:07.000+00:00
      properties:
        familyName:
          type: string
        invitedBy:
          description: The display name of the inviter.
          type: string
        displayName:
          description: The prefill for the name.
          type: string
        groupNames:
          items:
            type: string
          type: array
        expiresAt:
          format: date-time
          type: string
      required:
      - expiresAt
      - familyName
      - invitedBy
      type: object
    RedeemInvitationRequest:
      example:
        memberId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        displayName: displayName
        username: username
        password: password
        device:
          deviceName: Annas iPhone
          platform: IOS
          staySignedIn: true
          installationId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        memberId:
          description: |
            The id the new member gets, when the app brings one: a device that was used
            without a server keeps the member it created there, and every item that names it
            stays valid. Without it the server picks one. Taken already:
            `409 identity.id_taken`.
          format: uuid
          type: string
        displayName:
          type: string
        username:
          type: string
        password:
          format: password
          minLength: 8
          type: string
        device:
          $ref: "#/components/schemas/DeviceRegistration"
      required:
      - device
      - displayName
      - password
      - username
      type: object
    ShareSheet:
      description: |
        The share sheet, the same on every item. The order is fixed:
        owner, automatically assigned, inherited, own.
      example:
        itemType: itemType
        itemId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        ownerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        mayEdit: true
        myLevel: READ
        inheritedFromType: inheritedFromType
        inheritedFromId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        inheritedFromName: inheritedFromName
        entries:
        - subjectType: MEMBER
          subjectId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          level: null
          source: OWNER
        - subjectType: MEMBER
          subjectId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          level: null
          source: OWNER
      properties:
        itemType:
          type: string
        itemId:
          format: uuid
          type: string
        ownerId:
          format: uuid
          type: string
        mayEdit:
          description: |
            Only the owner may change the share. **Whoever may not change it still sees the
            sheet — read-only.** Knowing who sees something is not a privilege.
          type: boolean
        myLevel:
          $ref: "#/components/schemas/AccessLevel"
        inheritedFromType:
          description: "The container inherited from, as long as there is no own share."
          type: string
        inheritedFromId:
          format: uuid
          type: string
        inheritedFromName:
          description: "Its name, for \"inherited from *House & Tech*\"."
          type: string
        entries:
          items:
            $ref: "#/components/schemas/ShareEntry"
          type: array
      required:
      - entries
      - itemId
      - itemType
      - mayEdit
      type: object
    WriteSharesRequest:
      description: |
        Replaces the item's **own** shares. An empty list falls back to the inherited one
        — an own share replaces the inherited one, it does not add to it.
      example:
        shares:
        - subjectType: MEMBER
          subjectId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          level: READ
        - subjectType: MEMBER
          subjectId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          level: READ
      properties:
        shares:
          items:
            $ref: "#/components/schemas/WriteShare"
          type: array
      required:
      - shares
      type: object
    TrashList:
      example:
        entries:
        - itemType: itemType
          itemId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          title: title
          entityKey: entityKey
          deletedAt: 2000-01-23T04:56:07.000+00:00
          deletedBy: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          remainingDays: 0
          restorable: true
        - itemType: itemType
          itemId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          title: title
          entityKey: entityKey
          deletedAt: 2000-01-23T04:56:07.000+00:00
          deletedBy: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          remainingDays: 0
          restorable: true
        retentionDays: 6
      properties:
        entries:
          items:
            $ref: "#/components/schemas/TrashEntry"
          type: array
        retentionDays:
          description: |
            How long anything stays in the trash. Here and not only in the instance
            settings: those are for administrators, and everyone else was told the
            default instead of what applies.
          type: integer
      required:
      - entries
      - retentionDays
      type: object
    RestoreRequest:
      description: Where the item goes when it comes back.
      example:
        targetContainerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        targetContainerId:
          description: |
            The container to restore the item into -- a list for a task, a calendar for an
            event, a parent page for a wiki page. Needs write access to it. Left out, the
            item goes back where it was; that fails with `trash.container_gone` once its
            container is gone. Not every type has a container: for the others it is
            refused with `sync.no_container`.
          format: uuid
          type: string
      type: object
    InstanceSettings:
      description: |
        The instance settings. Administrator only.

        Numbers already assigned stay valid when a prefix changes -- it only affects what
        is created afterwards.
      example:
        familyName: familyName
        timezone: timezone
        keyPrefixTodo: TD
        keyPrefixEvent: EVT
        keyPrefixWikiPage: WIKI
        keyPrefixRecipe: REC
        keyPrefixTodoList: LST
        trashRetentionDays: 0
        logRetentionDays: 6
        backupFrequency: DAILY
        backupWeekday: 1
        backupTime: 02:00
        backupKeep: 18
      properties:
        familyName:
          type: string
        timezone:
          type: string
        keyPrefixTodo:
          example: TD
          type: string
        keyPrefixEvent:
          example: EVT
          type: string
        keyPrefixWikiPage:
          example: WIKI
          type: string
        keyPrefixRecipe:
          example: REC
          type: string
        keyPrefixTodoList:
          example: LST
          type: string
        trashRetentionDays:
          type: integer
        logRetentionDays:
          description: |
            Also limits how far back the **history** reaches. Minimum 14 days; the UI says
            both.
          type: integer
        backupFrequency:
          description: |
            How often the scheduled backup runs. There is no "off".
            Default `DAILY`.
          enum:
          - DAILY
          - WEEKLY
          type: string
        backupWeekday:
          description: "For `WEEKLY` -- ISO, 1 is Monday. Default 1."
          maximum: 7
          minimum: 1
          type: integer
        backupTime:
          description: |
            When the scheduled backup runs, `HH:mm` in the family's time zone. Default
            `02:00`. A change takes effect at once.
          example: 02:00
          type: string
        backupKeep:
          description: |
            How many archives are kept -- of every kind together. Default 7. Lowering it
            deletes the oldest at once; the UI says first how many.
          maximum: 30
          minimum: 1
          type: integer
      type: object
    BackupList:
      example:
        backups:
        - id: id
          createdAt: 2000-01-23T04:56:07.000+00:00
          bytes: 0
          serverVersion: serverVersion
          schemaVersion: schemaVersion
          reason: SCHEDULED
          updateTo: updateTo
          currentKey: true
        - id: id
          createdAt: 2000-01-23T04:56:07.000+00:00
          bytes: 0
          serverVersion: serverVersion
          schemaVersion: schemaVersion
          reason: SCHEDULED
          updateTo: updateTo
          currentKey: true
        status:
          lastBackupAt: 2000-01-23T04:56:07.000+00:00
          nextDueAt: 2000-01-23T04:56:07.000+00:00
          failure:
            at: 2000-01-23T04:56:07.000+00:00
            reason: DIRECTORY_NOT_WRITABLE
            trigger: SCHEDULED
          directory: directory
          passwordSet: true
      properties:
        backups:
          items:
            $ref: "#/components/schemas/BackupInfo"
          type: array
        status:
          $ref: "#/components/schemas/BackupStatus"
      required:
      - backups
      - status
      type: object
    BackupInfo:
      description: |
        An archive in the backup directory: data, images and a manifest, encrypted, as one
        file. Everything here is read from the archive's header, without the password --
        not secret, and not trusted either: on restore the manifest inside decides.
      example:
        id: id
        createdAt: 2000-01-23T04:56:07.000+00:00
        bytes: 0
        serverVersion: serverVersion
        schemaVersion: schemaVersion
        reason: SCHEDULED
        updateTo: updateTo
        currentKey: true
      properties:
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        bytes:
          format: int64
          type: integer
        serverVersion:
          type: string
        schemaVersion:
          type: string
        reason:
          description: Why it was made. The list names the last two.
          enum:
          - SCHEDULED
          - ON_DEMAND
          - BEFORE_UPDATE
          - BEFORE_RESTORE
          type: string
        updateTo:
          description: "For `BEFORE_UPDATE`, the version the server was updated to."
          type: string
        currentKey:
          description: |
            `false` for an archive made before the backup password was set anew: it opens
            only with the old password.
          type: boolean
      required:
      - bytes
      - createdAt
      - currentKey
      - id
      - reason
      - schemaVersion
      - serverVersion
      type: object
    BackupPasswordChange:
      example:
        currentPassword: currentPassword
        newPassword: newPassword
      properties:
        currentPassword:
          format: password
          type: string
        newPassword:
          format: password
          minLength: 8
          type: string
      required:
      - currentPassword
      - newPassword
      type: object
    BackupPasswordReset:
      example:
        newPassword: newPassword
      properties:
        newPassword:
          format: password
          minLength: 8
          type: string
      required:
      - newPassword
      type: object
    LogLines:
      description: |
        The server log, in English and structured. Personal data and content are not in
        it: IDs yes, titles no.
      example:
        lines:
        - lines
        - lines
      properties:
        lines:
          items:
            type: string
          type: array
      required:
      - lines
      type: object
    RefreshResult:
      example:
        subscriptionId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        ok: true
        importedCount: 0
        error: error
        lastSyncAt: 2000-01-23T04:56:07.000+00:00
      properties:
        subscriptionId:
          format: uuid
          type: string
        ok:
          description: |
            Whether the file could be fetched and imported. `false` does **not** mean the
            call failed -- the subscription still stands, with `error` attached to it.
          type: boolean
        importedCount:
          description: How many events are attached to the subscription after the
            sync.
          type: integer
        error:
          description: "The note on the subscription, if one came up."
          nullable: true
          type: string
        lastSyncAt:
          format: date-time
          nullable: true
          type: string
      required:
      - ok
      - subscriptionId
      type: object
    SubscriptionPreviewRequest:
      description: "An address to fetch, or the content of a file — one of the two."
      example:
        url: url
        ics: ics
      properties:
        url:
          nullable: true
          type: string
        ics:
          description: "The content of an `.ics` file, for the preview before an import."
          nullable: true
          type: string
      type: object
    SubscriptionPreview:
      example:
        name: name
        eventCount: 0
        upcoming:
        - title: title
          allDay: true
          startsAt: 2000-01-23T04:56:07.000+00:00
          startDate: 2000-01-23
          recurring: true
        - title: title
          allDay: true
          startsAt: 2000-01-23T04:56:07.000+00:00
          startDate: 2000-01-23
          recurring: true
      properties:
        name:
          description: "The calendar's own name (`X-WR-CALNAME`), as a suggestion\
            \ for ours."
          nullable: true
          type: string
        eventCount:
          type: integer
        upcoming:
          description: The next events from today on (up to twenty) — by their first
            date.
          items:
            $ref: "#/components/schemas/PreviewEvent"
          type: array
      required:
      - eventCount
      - upcoming
      type: object
    IcsImportRequest:
      description: |
        The file's content, or an address fetched **once** — one of the two. A link is not
        a subscription: nothing is fetched again later.
      example:
        ics: ics
        url: url
        newCalendar:
          name: name
          colorToken: BLUE
          locked: true
      properties:
        ics:
          description: The content of the `.ics` file.
          nullable: true
          type: string
        url:
          description: "An address to fetch the file from, once."
          nullable: true
          type: string
        newCalendar:
          $ref: "#/components/schemas/ImportCalendar"
      type: object
    IcsImportResult:
      example:
        importedCount: 0
        updatedCount: 6
      properties:
        importedCount:
          description: Events that were new in the calendar.
          type: integer
        updatedCount:
          description: Events already there (same UID) that were brought up to date.
          type: integer
      required:
      - importedCount
      - updatedCount
      type: object
    Agenda:
      description: |
        The coming occurrences for a home screen widget.

        **No enums in here**, on purpose: the widgets' clients are generated in Swift and
        Kotlin, and theirs throw on a value they do not know -- where the Dart client maps it
        to a placeholder. A field that would be an enum is a string, and the widget falls
        back on an unknown one.
      example:
        position: 0
        timeZone: timeZone
        from: 2026-11-12T14:05
        to: 2026-11-19T00:00
        occurrences:
        - eventId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          calendarId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          title: title
          location: location
          colorToken: colorToken
          start: 2026-11-12T08:00
          end: end
          allDay: true
          moved: true
        - eventId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          calendarId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          title: title
          location: location
          colorToken: colorToken
          start: 2026-11-12T08:00
          end: end
          allDay: true
          moved: true
        truncated: true
      properties:
        position:
          description: |
            The server's change position when it answered. The widget keeps the newer of
            this answer and the app's own picture of the same calendars.
          format: int64
          type: integer
        timeZone:
          description: The zone the window and the times are read in.
          type: string
        from:
          description: "The window's start, local time without zone (`yyyy-MM-ddTHH:mm`)."
          example: 2026-11-12T14:05
          type: string
        to:
          description: "The window's end, exclusive -- midnight after the last day."
          example: 2026-11-19T00:00
          type: string
        occurrences:
          items:
            $ref: "#/components/schemas/AgendaOccurrence"
          type: array
        truncated:
          description: Whether there were more occurrences than the limit let through.
          type: boolean
      required:
      - from
      - occurrences
      - position
      - timeZone
      - to
      - truncated
      type: object
    ListSummary:
      description: |
        A list for a home screen widget.

        **No enums in here**, on purpose: the widgets' clients are generated in Swift and
        Kotlin, and theirs throw on a value they do not know -- where the Dart client maps it
        to a placeholder. A field that would be an enum is a string, and the widget falls
        back on an unknown one.
      example:
        position: 0
        listId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        name: name
        kind: kind
        colorToken: colorToken
        archived: true
        openCount: 6
        doneCount: 1
        column:
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          colorToken: colorToken
          done: true
          count: 5
        items:
        - todoId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          title: title
          done: true
          amount: 5.637376656633329
          unit: unit
          dueDate: 2000-01-23
          dueTime: dueTime
        - todoId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          title: title
          done: true
          amount: 5.637376656633329
          unit: unit
          dueDate: 2000-01-23
          dueTime: dueTime
        truncated: true
      properties:
        position:
          description: |
            The server's change position when it answered. The widget keeps the newer of
            this answer and the app's own picture of the same list.
          format: int64
          type: integer
        listId:
          format: uuid
          type: string
        name:
          type: string
        kind:
          description: "The list's kind (`STANDARD`, `SHOPPING`, `KANBAN`), as a string."
          type: string
        colorToken:
          description: "The list's color token, as a string; unknown falls back to\
            \ `SLATE`."
          nullable: true
          type: string
        archived:
          description: An archived list is read-only; the widget still shows it.
          type: boolean
        openCount:
          description: The open entries of the whole list (the whole board).
          type: integer
        doneCount:
          description: The done entries of the whole list (the whole board).
          type: integer
        column:
          $ref: "#/components/schemas/ListSummaryColumn"
        items:
          description: |
            The open entries in the list's order -- or, with a column, the cards standing
            in it, done ones too if it is a done column.
          items:
            $ref: "#/components/schemas/ListSummaryItem"
          type: array
        truncated:
          description: Whether there were more entries than the limit let through.
          type: boolean
      required:
      - doneCount
      - items
      - kind
      - listId
      - name
      - openCount
      - position
      - truncated
      type: object
    RevisionList:
      example:
        revisions:
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          seq: 0
          changeSeq: 6
          title: title
          content: content
          authorId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          createdAt: 2000-01-23T04:56:07.000+00:00
          kind: SAVE
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          seq: 0
          changeSeq: 6
          title: title
          content: content
          authorId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          createdAt: 2000-01-23T04:56:07.000+00:00
          kind: SAVE
      properties:
        revisions:
          items:
            $ref: "#/components/schemas/Revision"
          type: array
      required:
      - revisions
      type: object
    Revision:
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        seq: 0
        changeSeq: 6
        title: title
        content: content
        authorId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        createdAt: 2000-01-23T04:56:07.000+00:00
        kind: SAVE
      properties:
        id:
          format: uuid
          type: string
        seq:
          type: integer
        changeSeq:
          description: |
            The history entry (`HistoryEntry.seq`) of the save that left this version. Not
            on a conflict version — the save that lost was never written — nor on one whose
            save the log no longer holds.
          format: int64
          type: integer
        title:
          type: string
        content:
          description: Only filled when reading a single revision.
          type: string
        authorId:
          format: uuid
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        kind:
          description: |
            `CONFLICT` records the version that lost in an editing conflict.
            Without it the losing side's work would be gone.
          enum:
          - SAVE
          - CONFLICT
          type: string
      required:
      - createdAt
      - id
      - kind
      - seq
      - title
      type: object
    LinkList:
      example:
        outgoing:
        - itemType: itemType
          itemId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          title: title
          entityKey: entityKey
        - itemType: itemType
          itemId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          title: title
          entityKey: entityKey
        incoming:
        - itemType: itemType
          itemId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          title: title
          entityKey: entityKey
        - itemType: itemType
          itemId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          title: title
          entityKey: entityKey
      properties:
        outgoing:
          items:
            $ref: "#/components/schemas/LinkRef"
          type: array
        incoming:
          items:
            $ref: "#/components/schemas/LinkRef"
          type: array
      required:
      - incoming
      - outgoing
      type: object
    LinkRef:
      example:
        itemType: itemType
        itemId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        title: title
        entityKey: entityKey
      properties:
        itemType:
          type: string
        itemId:
          format: uuid
          type: string
        title:
          description: "The **current** title, not the text that applied when it was\
            \ written."
          type: string
        entityKey:
          nullable: true
          type: string
      required:
      - itemId
      - itemType
      - title
      type: object
    ImageInfo:
      description: A stored image (`media`).
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        contentType: image/jpeg
        byteSize: 0
        width: 6
        height: 1
      properties:
        id:
          format: uuid
          type: string
        contentType:
          example: image/jpeg
          type: string
        byteSize:
          format: int64
          type: integer
        width:
          type: integer
        height:
          type: integer
      required:
      - byteSize
      - contentType
      - id
      type: object
    ProductList:
      example:
        products:
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          aisleId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          defaultUnit: defaultUnit
          usageCount: 0
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          aisleId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          defaultUnit: defaultUnit
          usageCount: 0
      properties:
        products:
          items:
            $ref: "#/components/schemas/Product"
          type: array
      required:
      - products
      type: object
    Product:
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        name: name
        aisleId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        defaultUnit: defaultUnit
        usageCount: 0
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        aisleId:
          description: |
            The category (`Aisle`) the shopping list groups it under, or none -- then "Other".
          format: uuid
          nullable: true
          type: string
        defaultUnit:
          nullable: true
