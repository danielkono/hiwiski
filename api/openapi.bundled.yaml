  /api/v1/calendar/subscriptions/{subscriptionId}/refresh:
    post:
      description: |
        The server fetches the file at the configured interval anyway — that is the point
        of a subscription: it lives on the server and not on the device, so that it keeps
        running when no device is online.

        This endpoint is the button next to it, for when someone does not want to wait for
        the next run.

        **A failure while fetching is not a failure of this call.** The subscription
        stays, the error is noted on it, and the response says what happened. In an earlier version
        the note ran in the same -- rolled back -- transaction, and instead of a readable
        state on the subscription the user got a server error.
      operationId: refreshCalendarSubscription
      parameters:
      - in: path
        name: subscriptionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResult"
          description: The sync has run -- successfully or with a note
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Not shared -- or `auth.password_change_required`: a session whose password
            has to be changed first may call almost nothing (`Session.mustChangePassword`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      summary: Sync an ICS subscription right now
      tags:
      - calendar
  /api/v1/calendar/subscriptions/preview:
    post:
      description: |
        Fetches the file (or reads the content sent along) and says what is in it — the
        calendar's own name, how many events, the next ones — **without storing anything**.
        Whoever subscribes or imports sees whether it is the right file before an empty or
        a wrong calendar lands in the family's view.
      operationId: previewCalendarSubscription
      requestBody:
