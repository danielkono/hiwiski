        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            image/*:
              schema:
                format: binary
                type: string
          description: The bytes
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not logged in
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Does not exist **or** is not visible. The same answer for both -- a `403` would
            give away that it exists.
      summary: The original
      tags:
      - images
  /api/v1/images/{id}/preview:
